<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>자기연민 디펜스</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#24201E;--cream:#FFF4D6;--red:#E23744;--blue:#2F6BFF;--paper:#FFFFFF;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);font-family:'Noto Sans KR','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;touch-action:none;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;transition:opacity .3s}
.pill{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;line-height:1.25;box-shadow:0 2px 0 rgba(90,60,0,.12)}
.pill small{display:block;font-size:11px;font-weight:500;opacity:.6}
#hudMoney{font-size:19px;font-weight:900;position:relative;min-width:110px;text-align:right}
#hudMoney.broke{color:var(--red)}
#hudDebt{color:var(--red);opacity:.85!important;font-size:11px;font-weight:800;display:none!important}
#hudDebt.on{display:block!important}
.fl{position:absolute;right:10px;top:-8px;font-size:14px;font-weight:800;animation:fl 1.2s ease-out forwards;white-space:nowrap}
.fl.minus{color:var(--red)}.fl.plus{color:#1E8A4B}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 6px calc(var(--sab) + 8px);display:flex;justify-content:center;align-items:flex-end;gap:5px;background:linear-gradient(to top,rgba(255,244,214,.97) 60%,rgba(255,244,214,0));pointer-events:none;transition:opacity .3s,transform .3s}
#bar.off{opacity:0;transform:translateY(30px);pointer-events:none}
.card{pointer-events:auto;width:min(13vw,92px,16vh);background:var(--paper);border-radius:12px;padding:5px 3px 4px;text-align:center;box-shadow:0 2px 0 rgba(90,60,0,.14);border:2px solid transparent;cursor:grab;transition:transform .12s,opacity .2s;position:relative}
.card img{width:76%;aspect-ratio:1;display:block;margin:0 auto;pointer-events:none}
.card .nm{font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap}
.card .pr{font-size:11px;font-weight:900;color:var(--red);line-height:1.1;margin-top:2px}
.card .am{font-size:10px;opacity:.55;line-height:1.1}
.card.sel{border-color:var(--red);transform:translateY(-6px)}
.card.no{opacity:.45}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 0 rgba(90,60,0,.15);pointer-events:none}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);background:rgba(255,255,255,.96);color:var(--ink);padding:9px 16px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 0 rgba(90,60,0,.14)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{pointer-events:auto;background:rgba(255,255,255,.97);border-radius:24px;padding:26px 30px 24px;text-align:center;box-shadow:0 6px 0 rgba(90,60,0,.16);min-width:min(82vw,340px)}
.box h1{margin:0 0 4px;font-size:38px;font-weight:900;letter-spacing:-1.5px;line-height:1.08}
.box h1 span{color:var(--red)}
.box p{margin:6px 0 18px;font-size:14px;font-weight:500;opacity:.78;line-height:1.5}
.box .st{font-size:15px;font-weight:700;margin:0 0 18px;line-height:1.7}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:17px;padding:12px 28px;border-radius:14px;cursor:pointer;margin:4px 3px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.hide{display:none!important}
 
#dayFade{position:absolute;inset:0;background:#13151e;opacity:0;pointer-events:none}
#hudRound{font-size:17px;padding:8px 13px}
.card .role{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:7px;padding:5px 8px;font-size:11px;white-space:nowrap;display:none;pointer-events:none}
.card.sel .role{display:block}
#bar.off .card{pointer-events:none}



.titleBox{background:none;box-shadow:none;padding:0 0 10px;display:flex;flex-direction:column;align-items:center}
.logo{display:block;width:min(94vw,480px,72vh);height:auto;overflow:visible;margin:0 auto 8px;animation:lgPop .6s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 7px 0 rgba(36,32,30,.22))}
.logo .lgFlag{animation:lgWave 1.8s ease-in-out infinite alternate}
.logo .lgGlint{animation:lgGlint 3.6s ease-in-out 1s infinite}
@keyframes lgPop{0%{transform:translateY(-40px) scale(1.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes lgWave{from{transform:skewY(-4deg) scaleX(.94)}to{transform:skewY(5deg) scaleX(1.04)}}
@keyframes lgGlint{0%{transform:skewX(-20deg) translateX(0)}45%,100%{transform:skewX(-20deg) translateX(560px)}}
.titleBox .btn{font-size:21px;padding:13px 40px;border-radius:16px;box-shadow:0 5px 0 rgba(36,32,30,.35)}




.speech{border:1px solid rgba(36,32,30,.16);background:#fff;box-shadow:0 2px 0 rgba(36,32,30,.08);padding:4px 9px!important;max-width:calc(100vw - 24px)}
.speech::after{content:"";position:absolute;left:var(--tail,50%);top:100%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 1px 0 rgba(36,32,30,.18))}
.box h1{margin-bottom:20px}
</style>

<body>

<canvas id="gl"></canvas>

  <div class="pill" id="hudRound">1일</div>

</div>
<div id="labels"></div>
<div id="bar"></div>
<div id="toast"></div>
<div id="overlay"></div>
</div>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   CONFIG
   ========================================================= */
const CFG = {
  START_MONEY: 20000, WAGE: 60000, BONUS_EVERY: 5, LOAN: 30000, LOAN_BACK: 39000, BROKE: 3000,
  MAX_EN: 340,
  ENTRY_TEAR: 0.012, INNER_EROSION: 0.00015, MAX_EROSION: 0.004, ENTER_TIME: 0.78, TEAR_CARRY: 0.5,
  CURVE: { base:18, grow:10, grow2:0.6 },
  ROOM: { x0:-1.2, x1:1.2, z0:-3.6, z1:1.9, H:2.4 },

  BATH: { x0:-1.0, x1:-0.52, h:1.9, day:3 },
  WIN: { x0:0.6, x1:1.02, y0:1.15, y1:1.7, day:6 },
  PARTY_DAY: 4,
  HEAD_KEEPOUT: 0.42,
};
const FOODS = [
  {id:'kimbap', name:'삼각김밥', price:1500, ammo:8,  cd:1.0,  range:1.1,  foot:0.09, h:0.11},
  {id:'ramen',  name:'컵라면',   price:2500, ammo:4,  cd:2.2,  range:0.95, foot:0.075, h:0.12, splash:0.2, maxKill:5},
  {id:'fries',  name:'감자튀김', price:3000, ammo:12, cd:1.0,  range:1.0,  foot:0.08, h:0.13, volley:2},
  {id:'cola',   name:'콜라',     price:3000, ammo:3,  cd:3.0,  range:0.85, foot:0.07, h:0.3, cone:3.2, killR:0.45, knockR:0.9, maxKill:10},
  {id:'burger', name:'햄버거',   price:5000, ammo:4,  cd:2.6,  range:1.5,  foot:0.1,  h:0.22, roll:1.6, maxKill:8},
  {id:'pizza',  name:'피자',     price:8000, ammo:8,  cd:0.9,  range:1.9,  foot:0.19, h:0.075, maxKill:10},
  {id:'chicken',name:'치킨',     price:15000,ammo:1,  cd:1.0,  range:1.6,  foot:0.16, h:0.14, blast:0.6, knock:1.1, minCrowd:15, grease:8, greaseR:0.27, maxKill:40},
];
const FOOD_BY = Object.fromEntries(FOODS.map(f=>[f.id,f]));
const LINES = ['아무도 나를 안 좋아해','내 편이 아무도 없어','나도 사랑받고 싶어','너무 힘들어','아무도 몰라줘','난 외톨이야','불쌍한 나','늘 고생하는 나','나는 사랑을 주는 것에만 익숙해','난 꿈이 없어','나는 관계가 서툴러','나는 상처가 많아','나는 언제쯤 행복해질까'];;

/* =========================================================
   UTILS
   ========================================================= */
const rand=(a,b)=>a+Math.random()*(b-a), irand=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, easeOut=t=>1-Math.pow(1-t,3), easeIn=t=>t*t*t;
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const V3=THREE.Vector3;
const tmpV=new V3(), tmpV2=new V3(), tmpV3=new V3(), tmpM=new THREE.Matrix4(), tmpM2=new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpE=new THREE.Euler();
const $=id=>document.getElementById(id);
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2); }
let seenHints={}; try{ seenHints=JSON.parse(localStorage.getItem('spd3_hints')||'{}'); }catch(e){}
function markHint(k){ seenHints[k]=1; try{ localStorage.setItem('spd3_hints',JSON.stringify(seenHints)); }catch(e){} }

/* =========================================================
   AUDIO
   ========================================================= */
let AC=null, master=null, noiseBuf=null, murmurG=null, murmurSrc=null;
// Korean speech for the "또르르" line (browser voice).
const TTS={ ok:'speechSynthesis' in window, voice:null, unlocked:false,
  pick(){ if(!this.ok) return; const vs=speechSynthesis.getVoices(), ko=vs.filter(v=>/^ko/i.test(v.lang)); this.voice=ko.find(v=>/Google|Yuna|유나|SunHi|Heami/i.test(v.name))||ko[0]||null; this.voice2=ko.find(v=>v!==this.voice&&/Minsu|민수|InJoon|Hyunsu|Sora|소라|Jian|Seoyeon/i.test(v.name))||ko.find(v=>v!==this.voice)||this.voice; },
  unlock(){ if(!this.ok||this.unlocked) return; this.unlocked=true; try{ const u=new SpeechSynthesisUtterance(' '); u.lang='ko-KR'; u.volume=0; speechSynthesis.speak(u); }catch(e){} },
  say(text,o){ if(!this.ok) return; o=o||{}; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; const vc=o.alt?this.voice2:this.voice; if(vc) u.voice=vc; u.rate=o.rate||0.75; u.pitch=o.pitch||1.3; u.volume=1; speechSynthesis.speak(u); }catch(e){} } };
if(TTS.ok){ TTS.pick(); speechSynthesis.addEventListener('voiceschanged',()=>TTS.pick()); }
function audioInit(){
  TTS.unlock();
  try{
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.18;
    master=AC.createGain(); master.gain.value=0.85; master.connect(comp); comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    murmurG=AC.createGain(); murmurG.gain.value=0; murmurG.connect(master);
    murmurSrc=AC.createBufferSource(); murmurSrc.buffer=noiseBuf; murmurSrc.loop=true;
    const mf=AC.createBiquadFilter(); mf.type='bandpass'; mf.frequency.value=380; mf.Q.value=0.7;
    const lfo=AC.createOscillator(); lfo.frequency.value=3.1; const lg=AC.createGain(); lg.gain.value=0.35; lfo.connect(lg);
    const vg=AC.createGain(); vg.gain.value=0.65; lg.connect(vg.gain);
    murmurSrc.connect(mf); mf.connect(vg); vg.connect(murmurG); murmurSrc.start(); lfo.start();
    setTimeout(()=>{ if(SFX._buzzN) SFX.setBuzz(SFX._buzzN); },50);
  }catch(e){ AC=null; }
}
function nz(o){ if(!AC) return; const t=AC.currentTime+(o.when||0);
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.playbackRate.value=o.rate||1;
  const f=AC.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur); f.Q.value=o.q||0.8;
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.3,t+(o.a||0.004)); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t,Math.random()*1.2); src.stop(t+o.dur+0.05); }
function tn(o){ if(!AC) return; const t=AC.currentTime+(o.when||0);
  const os=AC.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f,t); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.2,t+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  let node=os; if(o.lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; f.Q.value=o.q||1; os.connect(f); node=f; }
  node.connect(g); g.connect(master); os.start(t); os.stop(t+o.dur+0.05); }
let lastSplat=0, splatN=0;
const SFX={
  sobCut(){ const p=rand(1.0,1.6); tn({type:'sawtooth',f:340*p,f2:470*p,g:0.06,dur:0.07,lp:1500}); },
  burst(pw){ if(!AC) return; const now=AC.currentTime; if(now-lastSplat<0.035){ splatN++; if(splatN>5) return; } else splatN=0; lastSplat=now; pw=pw||1; const p=rand(0.85,1.2);
    this.sobCut(); tn({type:'sine',f:150*p,f2:42,g:0.4*pw,dur:0.14,when:0.02}); nz({type:'lowpass',f:2600*p,f2:280,q:1.4,g:0.4*pw,dur:0.18,when:0.02}); nz({type:'highpass',f:3200,g:0.07*pw,dur:0.05,when:0.02,rate:1.7}); },
  crush(){ if(!AC) return; this.sobCut(); tn({type:'sine',f:105,f2:30,g:0.55,dur:0.28,when:0.01}); nz({type:'lowpass',f:1300,f2:110,q:2,g:0.5,dur:0.26,when:0.01}); for(let i=0;i<4;i++) nz({type:'highpass',f:2400,g:0.1,dur:0.03,when:0.03+i*0.03,rate:rand(0.8,1.6)}); },
  kimbap(){ nz({type:'bandpass',f:1200,f2:3200,q:1.4,g:0.12,dur:0.1}); },
  fries(){ nz({type:'bandpass',f:1800,f2:4200,q:1.6,g:0.08,dur:0.07}); },
  ramenFire(){ nz({type:'bandpass',f:900,f2:2200,q:1,g:0.12,dur:0.16}); },
  ramenSplash(){ nz({type:'bandpass',f:1600,f2:500,q:0.8,g:0.35,dur:0.32}); tn({type:'sine',f:900,f2:260,g:0.08,dur:0.12,when:0.02}); tn({type:'sine',f:1300,f2:500,g:0.05,dur:0.1,when:0.09}); },
  cola(){ nz({type:'highpass',f:2600,f2:6500,g:0.32,dur:0.8,a:0.02}); tn({type:'square',f:210,f2:70,g:0.14,dur:0.12,lp:900}); nz({type:'lowpass',f:900,f2:120,g:0.4,dur:0.3}); },
  burger(){ nz({type:'lowpass',f:320,f2:160,g:0.28,dur:0.9,a:0.05}); tn({type:'sine',f:120,f2:70,g:0.12,dur:0.5}); },
  pizza(){ if(!AC) return; const t=AC.currentTime; const os=AC.createOscillator(); os.type='sawtooth'; os.frequency.setValueAtTime(110,t); os.frequency.exponentialRampToValueAtTime(70,t+0.7); const lfo=AC.createOscillator(); lfo.frequency.value=26; const lg=AC.createGain(); lg.gain.value=30; lfo.connect(lg); lg.connect(os.frequency); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=2; const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.75); os.connect(f); f.connect(g); g.connect(master); os.start(t); lfo.start(t); os.stop(t+0.8); lfo.stop(t+0.8); },
  chickenFly(){ nz({type:'bandpass',f:300,f2:1200,q:0.9,g:0.25,dur:0.4}); },
  chickenLand(){ tn({type:'sine',f:85,f2:22,g:0.9,dur:0.7}); nz({type:'lowpass',f:700,f2:50,q:1,g:0.8,dur:0.6}); tn({type:'triangle',f:55,f2:28,g:0.5,dur:0.9}); for(let i=0;i<6;i++) nz({type:'highpass',f:2000,g:0.12,dur:0.04,when:0.05+i*0.04,rate:rand(0.7,1.5)}); },
  place(){ nz({type:'bandpass',f:2400,f2:1200,q:1.2,g:0.18,dur:0.12}); tn({type:'sine',f:180,f2:90,g:0.12,dur:0.1,when:0.03}); },
  refill(){ tn({type:'triangle',f:1046,g:0.12,dur:0.1}); tn({type:'triangle',f:1568,g:0.14,dur:0.22,when:0.08}); nz({type:'bandpass',f:2400,f2:1400,q:1.2,g:0.1,dur:0.1}); },
  broke(){ tn({type:'square',f:120,g:0.12,dur:0.1,lp:700}); tn({type:'square',f:100,g:0.12,dur:0.14,when:0.12,lp:700}); },
  fling(){ nz({type:'bandpass',f:500,f2:2400,g:0.22,dur:0.35}); },
  sniff(v){ v=v||0.05; const p=rand(0.8,1.3); nz({type:'bandpass',f:2000*p,f2:3200*p,q:3,g:v,dur:0.09}); nz({type:'bandpass',f:2200*p,f2:3600*p,q:3,g:v*1.2,dur:0.12,when:0.13}); },
  heuk(v){ v=v||0.05; const p=rand(1.1,1.7); tn({type:'sawtooth',f:300*p,f2:250*p,g:v,dur:0.16,lp:1300,q:4}); nz({type:'bandpass',f:1200,q:2,g:v*0.6,dur:0.08}); },
  door(){ tn({type:'sawtooth',f:180,f2:140,g:0.05,dur:0.5,lp:600,q:6}); nz({type:'bandpass',f:700,q:2,g:0.06,dur:0.4}); },
  doorClose(){ tn({type:'sine',f:160,f2:60,g:0.25,dur:0.14}); nz({type:'lowpass',f:1500,f2:200,g:0.2,dur:0.12}); },

const camView={w:1,h:1,play:1,top:8}, eyeV=new V3(), eyePts=[];

function scrX(x,y,z){ eyeV.set(x,y,z).project(camera); return (eyeV.x*0.5+0.5)*camView.w; }

  // Measure the eyes in the lying pose, even if the figure is standing in the cut scene.
  const R=GI.root, keepP=R.position.clone(), keepR=R.rotation.clone();
  R.position.set(0,0.17,0.735); R.rotation.set(-Math.PI/2,0,0); R.updateMatrixWorld(true);
  const all=[]; for(const E of GI.eyes){ const pos=E.mesh.geometry.attributes.position; for(let i=0;i<pos.count;i++) all.push(new V3().fromBufferAttribute(pos,i).applyMatrix4(E.mesh.matrixWorld)); }
  R.position.copy(keepP); R.rotation.copy(keepR); R.updateMatrixWorld(true);

  all.sort((a,b)=>b.z-a.z); eyePts.length=0; for(let i=0;i<Math.min(120,all.length);i++) eyePts.push(all[i]);
}

function fitFov(camY,camZ,sides=true){

  camera.position.set(0,camY,camZ); let flo=20, fhi=120;
  for(let j=0;j<16;j++){ const fm=(flo+fhi)/2; aimEyes(fm); if(frameOk(sides)) fhi=fm; else flo=fm; }

function layoutCamera(){

  camView.w=w; camView.h=h; camView.play=Math.max(120, barTopPx()-4); camView.top=hudBottomPx();
  renderer.setSize(w,h,false);
  const pc=clamp((w/h-0.48)/(1.75-0.48),0,1);
  camCut.fov=lerp(82,64,pc); camCut.pos.set(0,lerp(2.30,2.60,pc),lerp(2.25,2.75,pc)); camCut.tgt.set(0,0.50,-1.45);
  collectEyePts(); setProj(camView.play);
  const a=w/camView.play, p=clamp((a-0.48)/(1.75-0.48),0,1), camZ=lerp(0.5,0.65,p);
  // On tall screens the width decides the view and empty wall piles up above the door.
  // Raise the camera until the door reaches the top edge, so the floor fills that space instead.
  let camY=lerp(0.97,1.2,p), fov=fitFov(camY,camZ);
  if(scrY(0,FRAME_DOOR_H,ROOM.z0)>camView.top+2){
    let ylo=camY, yhi=Math.max(camY,FRAME_CAM_MAX_Y);
    fitFov(yhi,camZ); if(scrY(0,FRAME_DOOR_H,ROOM.z0)>camView.top+2){ camY=yhi; } else { for(let k=0;k<12;k++){ const ym=(ylo+yhi)/2; fitFov(ym,camZ); if(scrY(0,FRAME_DOOR_H,ROOM.z0)>camView.top+2) ylo=ym; else yhi=ym; } camY=yhi; }
    fov=fitFov(camY,camZ);
    // Still empty wall above the door at the height limit: keep the door on the top edge and let the sides go.
    if(scrY(0,FRAME_DOOR_H,ROOM.z0)>camView.top+2) fov=fitFov(camY,camZ,false);
  }
  camBase.pos.set(0,camY,camZ); camBase.fov=fov; camBase.tgt.set(0,aimEyes(fov),-2.0);
  applyCamera();
}




function applyCamera(){
  const k=ease(clamp(camMix,0,1));
  camera.fov=lerp(camBase.fov,camCut.fov,k); setProj(lerp(camView.play,camView.h,k));
  tmpV.lerpVectors(camBase.pos,camCut.pos,k); tmpV2.lerpVectors(camBase.tgt,camCut.tgt,k);
  if(camShake>0.0005){ tmpV.x+=rand(-camShake,camShake); tmpV.y+=rand(-camShake,camShake)*0.6; }

}

function surfacePatch(radii, dir, w, h, segs){

  const pos=[], uv=[], nor=[], idx=[];

function groundY(x,z){
  let y=0;
  if(x>-0.52&&x<0.52&&z>-0.32&&z<1.82) y=0.06;
  if(x>-0.27&&x<0.27&&z>-0.2&&z<0.16){ const u=1-Math.max(Math.abs(x)/0.27,Math.abs(z-(-0.02))/0.18); y=0.06+0.05*clamp(u*2,0,1); }
  return y;
}
function isStaticBlocked(x,z){
  if(x<ROOM.x0+0.05||x>ROOM.x1-0.05||z<ROOM.z0+0.02||z>ROOM.z1-0.05) return true;
  if(Math.abs(x)>walkW(z)) return true;
  if(staticAt(x,z)) return true;
  if(segDist(x,z,LEAF.x0,LEAF.z0,LEAF.x1,LEAF.z1)<LEAF.r) return true;
  if(x>-0.3&&x<0.3&&z>0.2&&z<ROOM.z1) return true; // lying body
  return false;
}

let towers=[], projs=[], trash=[], towerSeq=0, zones=[], lumps=[];
function updZones(dt){ for(let i=zones.length-1;i>=0;i--){ const z=zones[i]; z.t-=dt; z.cd-=dt; if(z.t<=0){ zones.splice(i,1); continue; } if(z.cd>0) continue; let victim=null; shQuery(z.x,z.z,z.r,(e)=>{ if(victim||!e.alive||(e.state!=='walk'&&e.state!=='squat'&&e.state!=='slip')) return; victim=e; }); if(victim){ killEnemy(victim,'crush'); SFX.crush(); z.cd=0.28; burstParts(z.x,0.03,z.z,4,'#C98A2B',0.8,'crumb',0.006); } } }
const towerG=new THREE.Group(); scene.add(towerG);
function towerPos(t){ return new V3(t.x, groundY(t.x,t.z), t.z); }
function makeTower(foodId,x,z,ammo){
  if(ammo!==undefined&&ammo<=0) return null;
  const food=FOOD_BY[foodId]; const t={id:towerSeq++, food, x, z, ammo:ammo===undefined?food.ammo:ammo, cdT:rand(0.2,0.6), full:null, empty:null, blocks:true, pulse:0, yaw:rand(-0.4,0.4), badge:null};
  t.full=buildFood(foodId,true); t.full.rotation.y=t.yaw;
  const p=towerPos(t); t.full.position.copy(p); towerG.add(t.full);
  t.full.userData.tower=t;
  setTowerState(t); towers.push(t); return t;
}
function setTowerState(t){ const e=t.ammo<=0; t.full.visible=!e; t.blocks=!e; if(t.food.id==='pizza'&&!e){ const pz=t.full.getObjectByName('pizza'); if(pz) pz.children.forEach((s,i)=>{ s.visible=i<t.ammo; }); } if(t.food.id==='chicken'){ const c=t.full.getObjectByName('chicken'); if(c) c.visible=t.ammo>0; } }
function removeTower(t){ towerG.remove(t.full); towers=towers.filter(x=>x!==t); if(t.badge){ t.badge.remove(); t.badge=null; } }

// targeting helpers
function enemiesInRange(x,z,r){ const out=[]; shQuery(x,z,r,(e)=>{ if(e.alive&&e.state!=='dead'&&e.state!=='leave'&&e.state!=='wander'&&e.state!=='enter'&&e.state!=='intro') out.push(e); }); return out; }
function headDist(e){ return Math.hypot(e.x-HEADW.c.x,e.z-HEADW.c.z); }
function bestCluster(cands, r){ let best=null, bn=0; for(const e of cands){ let n=0; for(const o of cands){ if(Math.hypot(o.x-e.x,o.z-e.z)<r) n++; } if(n>bn||(n===bn&&best&&headDist(e)<headDist(best))){ bn=n; best=e; } } return {best,n:bn}; }
function bestLine(cands, x, z, len, w){ let best=null, bn=0; for(const e of cands){ const dx=e.x-x, dz=e.z-z, l=Math.hypot(dx,dz)||1; const ux=dx/l, uz=dz/l; let n=0; for(const o of cands){ const ox=o.x-x, oz=o.z-z; const along=ox*ux+oz*uz; if(along<0||along>len) continue; const perp=Math.abs(ox*uz-oz*ux); if(perp<w) n++; } if(n>bn){ bn=n; best=[ux,uz]; } } return {dir:best,n:bn}; }
function fireTower(t){
  const f=t.food; const p=towerPos(t); const cands=enemiesInRange(t.x,t.z,f.range); if(!cands.length) return false;
  t.pulse=1;

    const r=t.food.foot+TOWER_BODY_PAD, dx=e.x-t.x, dz=e.z-t.z, d2=dx*dx+dz*dz; if(d2>=r*r) continue;

      const gy=groundY(e.x,e.z), hy=headSurfaceY(e.x,e.z); if(e.y<=Math.max(gy,hy)){ if(hy>gy){ e.y=hy; startEnter(e); } else { e.y=gy; e.state='walk'; e.vx*=0.2; e.vz*=0.2; e.yaw=e.ry; e.t=0; } } }
    else if(e.state==='leave'){ e.scale=Math.max(0,e.scale-dt*1.6); e.y=groundY(e.x,e.z)+(1-e.scale)*0.02; if(e.scale<=0.02) removeEnemy(e); }
    else if(e.state==='wander'){ if(!e.tgt||e.t>rand(6,9)){ const tz=rand(-3.2,-0.9); e.tgt=[rand(-1,1)*walkW(tz)*0.8,tz]; e.t=0; } let dx=e.tgt[0]-e.x, dz=e.tgt[1]-e.z; const d=Math.hypot(dx,dz); if(d<0.05){ e.tgt=null; continue; } dx/=d; dz/=d; const nx=e.x+(dx*e.speed+e.sx)*dt, nz=e.z+(dz*e.speed+e.sz)*dt; if(FF.isBase(nx,nz)){ e.tgt=null; continue; } e.vx=dx*e.speed; e.vz=dz*e.speed; e.x=nx; e.z=nz; pushOutOfTowers(e); e.y=groundY(e.x,e.z); e.anim+=dt*(e.speed*40+1.5); const ty=Math.atan2(e.vx,e.vz); let dd=ty-e.yaw; dd=Math.atan2(Math.sin(dd),Math.cos(dd)); e.yaw+=dd*Math.min(1,dt*6); }

function updTowers(dt){

    t.cdT-=dt; if(t.cdT<=0&&!fireTower(t)) t.cdT=0.25;
  }
}

/* ---------- play update ---------- */
function updPlay(dt){
  G.t+=dt;
  while(G.cueIdx<G.cues.length&&G.cues[G.cueIdx].t<=G.t){ const c=G.cues[G.cueIdx]; doCue(c); if(c.ent==='door') G.kickAt=c.flood; G.cueIdx++; }
  if(G.kickAt&&G.t>=G.kickAt){ G.kickAt=0; ENTR.doorKick=0.75; SFX.doorBurst(); if(G.party){ SFX.horn(); setTimeout(()=>SFX.horn(1.2),260); } }
  while(G.spawnIdx<G.spawns.length&&G.spawns[G.spawnIdx].t<=G.t){ spawnFrom(G.spawns[G.spawnIdx].ent,{speed:G.plan.speed}); G.spawnIdx++; }
  for(let i=G.extra.length-1;i>=0;i--){ if(G.extra[i].t<=G.t){ spawnFrom(G.extra[i].ent,{speed:G.plan.speed}); G.extra.splice(i,1); } }
  updTowers(dt); updEnemies(dt); updProjs(dt); updZones(dt); updParts(dt);
  G.gnawPulse=Math.max(0,G.gnawPulse-dt*3);
  if(G.invaders){
    // Each one remains inside for this stage; there is no cleansing action.
    G.tear+=Math.min(CFG.MAX_EROSION,G.invaders*CFG.INNER_EROSION)*dt;
    if(Math.random()<dt*Math.min(4,G.invaders*0.14)) G.gnawPulse=Math.max(G.gnawPulse,0.28);
  }
  if(G.tear>=1){ G.tear=1; startCry(); return; }
  let walkers=0; for(const e of EN.list) if(e.state==='walk') walkers++;
  // Only the crowd already in the room can make a sound. No arrival cue.
  if(walkers>0&&Math.random()<Math.min(0.55,walkers*0.012)*dt*10){ Math.random()<0.55?SFX.sniff(0.03+Math.min(0.03,walkers*0.0004)):SFX.heuk(0.024); }
  if(walkers>6&&Math.random()<dt*Math.min(30,walkers*0.8)) SFX.patter(Math.min(0.05,0.008+walkers*0.0008));
  if(allSpawned()){
    const alive=EN.list.filter(e=>e.alive&&e.state!=='leave').length;
    if(alive===0&&projs.length===0){ endRound(); }
    else G.stallT=0;
  }
}

  if(!c.cameo){ c.cameo=spawnEnemy({x:-0.8,z:-2.9,state:'walk',speed:0.2}); if(!c.cameo) return; }
  const e=c.cameo, u=(k-a)/(b-a);
  e.x=lerp(-0.8,0.78,u); e.z=-2.9+Math.sin(u*Math.PI*2)*0.04; e.y=groundY(e.x,e.z); e.yaw=Math.PI/2; e.anim+=dt*40;

}
function cutPay(){ if(!CUT||CUT.paid) return; CUT.paid=true;
  const bonus=G.round>0&&G.round%CFG.BONUS_EVERY===0, pay=CFG.WAGE*(bonus?2:1), back=Math.min(G.debt,pay);
  G.debt-=back; G.money+=pay-back; SFX.coin(); if(bonus) SFX.bonus(); floatMoney('+'+won(pay),'plus');
  if(back>0) setTimeout(()=>{ floatMoney('-'+won(back),'minus'); SFX.broke(); },650); hudDirty=true; }

      GI.legL.rotation.set(0,0,(0.04+0.08*k0)*(1-k)); GI.legR.rotation.set(0,0,-(0.04+0.08*k0)*(1-k)); GI.armL.rotation.set(lerp(-0.08,0.03,k),0,-lerp(lieArm,GI.armOut(),k)); GI.armR.rotation.set(lerp(-0.08,0.03,k),0,lerp(lieArm,GI.armOut(),k)); GI.elbowL.rotation.set(lerp(-0.10,-0.18,k),0,0.04); GI.elbowR.rotation.set(lerp(-0.10,-0.18,k),0,-0.04);

function finishCut(){

  for(let i=0;i<2;i++){ const B=beads[i], s=B.side; const cornerD=new V3(s*0.66,0.86,-0.12).normalize(), earD=new V3(s*0.98,-0.02,-0.08).normalize();

let bubbles=[];
// 대사 뽑기: 13개를 섞어 한 바퀴 다 쓴 뒤 다시 섞음. 지금 떠 있는 대사와 바로 전 대사는 건너뜀.
let lineBag=[], lastLine='';
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function nextLine(){
  const busy=new Set(bubbles.map(b=>b.el.textContent)); if(LINES.length>busy.size+1) busy.add(lastLine);
  let i=lineBag.findIndex(l=>!busy.has(l));
  if(i<0){ lineBag=lineBag.concat(shuffled(LINES)); i=lineBag.findIndex(l=>!busy.has(l)); }
  if(i<0) return lastLine=pick(LINES);
  return lastLine=lineBag.splice(i,1)[0];
}
function updateBubbles(dt){
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.t-=dt; if(b.t<=0||!b.e.alive||b.e.state!=='walk'){ b.el.remove(); b.e.bubble=null; bubbles.splice(i,1); continue; }
    projectTo(b.e.x,b.e.y+0.2,b.e.z,scr); const bw=b.el.offsetWidth, bx=clamp(scr.x,12+bw/2,window.innerWidth-12-bw/2); b.el.style.left=bx+'px'; b.el.style.top=(scr.y-8)+'px'; b.el.style.setProperty('--tail',clamp(scr.x-bx+bw/2,8,bw-8)+'px'); b.el.style.opacity=Math.min(1,b.t*3,(2.6-b.t)*4); }

}

    const m=o.material; const key=[m.type,m.color?m.color.getHexString():'',m.roughness,m.metalness,m.map?m.map.uuid:'',m.transparent,m.opacity,m.side,m.depthWrite].join('|');
    let b=buckets.get(key); if(!b){ b={mat:m,geos:[],cast:false,recv:false}; buckets.set(key,b); }
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    if(!g.attributes.normal) g.computeVertexNormals(); if(!g.attributes.uv) g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    b.geos.push(g); b.cast=b.cast||o.castShadow; b.recv=b.recv||o.receiveShadow; gone.push(o); }); }
  for(const o of gone) o.parent.remove(o);
  for(const b of buckets.values()){ let n=0; for(const g of b.geos) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let off=0;
    for(const g of b.geos){ pos.set(g.attributes.position.array,off*3); nor.set(g.attributes.normal.array,off*3); uv.set(g.attributes.uv.array,off*2); off+=g.attributes.position.count; g.dispose(); }
    const mg=new THREE.BufferGeometry(); mg.setAttribute('position',new THREE.BufferAttribute(pos,3)); mg.setAttribute('normal',new THREE.BufferAttribute(nor,3)); mg.setAttribute('uv',new THREE.BufferAttribute(uv,2)); mg.computeBoundingSphere();
    const mm=new THREE.Mesh(mg,b.mat); mm.castShadow=b.cast; mm.receiveShadow=b.recv; mm.matrixAutoUpdate=false; mm.updateMatrix(); scene.add(mm); }
}
