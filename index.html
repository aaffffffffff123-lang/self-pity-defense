<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);font-family:'Noto Sans KR','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;touch-action:none;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;transition:opacity .3s}
.pill{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;line-height:1.25;box-shadow:0 2px 0 rgba(90,60,0,.12)}

#hudMoney{font-size:19px;font-weight:900;position:relative;min-width:110px;text-align:right}
#hudMoney.broke{color:var(--red)}
.fl{position:absolute;right:10px;top:-8px;font-size:14px;font-weight:800;animation:fl 1.2s ease-out forwards;white-space:nowrap}
.fl.minus{color:var(--red)}.fl.plus{color:#1E8A4B}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 6px calc(var(--sab) + 8px);display:flex;justify-content:center;align-items:flex-end;gap:5px;background:linear-gradient(to top,rgba(255,244,214,.97) 60%,rgba(255,244,214,0));pointer-events:none;transition:opacity .3s,transform .3s}
#bar.off{opacity:0;transform:translateY(30px);pointer-events:none}
.card{pointer-events:auto;width:min(13vw,92px,16vh);background:var(--paper);border-radius:12px;padding:5px 3px 4px;text-align:center;box-shadow:0 2px 0 rgba(90,60,0,.14);border:2px solid transparent;cursor:grab;transition:transform .12s,opacity .2s;position:relative}
.card img{width:76%;aspect-ratio:1;display:block;margin:0 auto;pointer-events:none}
.card .nm{font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap}
.card .pr{font-size:11px;font-weight:900;color:var(--red);line-height:1.1;margin-top:2px}
.card .am{font-size:10px;opacity:.55;line-height:1.1}
.card.sel{border-color:var(--red);transform:translateY(-6px)}
.card.no{opacity:.45}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 0 rgba(90,60,0,.15);pointer-events:none}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);background:rgba(255,255,255,.96);color:var(--ink);padding:9px 16px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 0 rgba(90,60,0,.14)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{pointer-events:auto;background:rgba(255,255,255,.97);border-radius:24px;padding:26px 30px 24px;text-align:center;box-shadow:0 6px 0 rgba(90,60,0,.16);min-width:min(82vw,340px)}
.box h1{margin:0 0 4px;font-size:38px;font-weight:900;letter-spacing:-1.5px;line-height:1.08}
.box h1 span{color:var(--red)}
.box p{margin:6px 0 18px;font-size:14px;font-weight:500;opacity:.78;line-height:1.5}
.box .st{font-size:15px;font-weight:700;margin:0 0 18px;line-height:1.7}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:17px;padding:12px 28px;border-radius:14px;cursor:pointer;margin:4px 3px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.hide{display:none!important}
 
#dayFade{position:absolute;inset:0;background:#13151e;opacity:0;pointer-events:none}
#hudRound{font-size:17px;padding:8px 13px}
.card .role{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:7px;padding:5px 8px;font-size:11px;white-space:nowrap;display:none;pointer-events:none}
.card.sel .role{display:block}
#bar.off .card{pointer-events:none}
.speech{border:1px solid rgba(36,32,30,.16);background:#fff;box-shadow:0 2px 0 rgba(36,32,30,.08);padding:4px 9px!important;max-width:calc(100vw - 24px)}
.speech::after{content:"";position:absolute;left:var(--tail,50%);top:100%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 1px 0 rgba(36,32,30,.18))}
.box h1{margin-bottom:20px}

<script type="module">
import * as THREE from 'three';

/* =========================================================

   ========================================================= */
const rand=(a,b)=>a+Math.random()*(b-a), irand=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, easeOut=t=>1-Math.pow(1-t,3), easeIn=t=>t*t*t;

const V3=THREE.Vector3;
const tmpV=new V3(), tmpV2=new V3(), tmpV3=new V3(), tmpM=new THREE.Matrix4(), tmpM2=new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpE=new THREE.Euler();
const $=id=>document.getElementById(id);
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2); }
let seenHints={}; try{ seenHints=JSON.parse(localStorage.getItem('spd3_hints')||'{}'); }catch(e){}
function markHint(k){ seenHints[k]=1; try{ localStorage.setItem('spd3_hints',JSON.stringify(seenHints)); }catch(e){} }

/* =========================================================
   AUDIO
   ========================================================= */
let AC=null, master=null, noiseBuf=null, murmurG=null, murmurSrc=null;
function audioInit(){
  try{
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.18;
    master=AC.createGain(); master.gain.value=0.85; master.connect(comp); comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    murmurG=AC.createGain(); murmurG.gain.value=0; murmurG.connect(master);
    murmurSrc=AC.createBufferSource(); murmurSrc.buffer=noiseBuf; murmurSrc.loop=true;
    const mf=AC.createBiquadFilter(); mf.type='bandpass'; mf.frequency.value=380; mf.Q.value=0.7;
    const lfo=AC.createOscillator(); lfo.frequency.value=3.1; const lg=AC.createGain(); lg.gain.value=0.35; lfo.connect(lg);
    const vg=AC.createGain(); vg.gain.value=0.65; lg.connect(vg.gain);
    murmurSrc.connect(mf); mf.connect(vg); vg.connect(murmurG); murmurSrc.start(); lfo.start();
  }catch(e){ AC=null; }
}
function nz(o){ if(!AC) return; const t=AC.currentTime+(o.when||0);
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.playbackRate.value=o.rate||1;
  const f=AC.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur); f.Q.value=o.q||0.8;
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.3,t+(o.a||0.004)); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t,Math.random()*1.2); src.stop(t+o.dur+0.05); }
function tn(o){ if(!AC) return; const t=AC.currentTime+(o.when||0);
  const os=AC.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f,t); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.2,t+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  let node=os; if(o.lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; f.Q.value=o.q||1; os.connect(f); node=f; }
  node.connect(g); g.connect(master); os.start(t); os.stop(t+o.dur+0.05); }
let lastSplat=0, splatN=0;
const SFX={
  sobCut(){ const p=rand(1.0,1.6); tn({type:'sawtooth',f:340*p,f2:470*p,g:0.06,dur:0.07,lp:1500}); },
  burst(pw){ if(!AC) return; const now=AC.currentTime; if(now-lastSplat<0.035){ splatN++; if(splatN>5) return; } else splatN=0; lastSplat=now; pw=pw||1; const p=rand(0.85,1.2);
    this.sobCut(); tn({type:'sine',f:150*p,f2:42,g:0.4*pw,dur:0.14,when:0.02}); nz({type:'lowpass',f:2600*p,f2:280,q:1.4,g:0.4*pw,dur:0.18,when:0.02}); nz({type:'highpass',f:3200,g:0.07*pw,dur:0.05,when:0.02,rate:1.7}); },
  crush(){ if(!AC) return; this.sobCut(); tn({type:'sine',f:105,f2:30,g:0.55,dur:0.28,when:0.01}); nz({type:'lowpass',f:1300,f2:110,q:2,g:0.5,dur:0.26,when:0.01}); for(let i=0;i<4;i++) nz({type:'highpass',f:2400,g:0.1,dur:0.03,when:0.03+i*0.03,rate:rand(0.8,1.6)}); },
  kimbap(){ nz({type:'bandpass',f:1200,f2:3200,q:1.4,g:0.12,dur:0.1}); },
  fries(){ nz({type:'bandpass',f:1800,f2:4200,q:1.6,g:0.08,dur:0.07}); },
  ramenFire(){ nz({type:'bandpass',f:900,f2:2200,q:1,g:0.12,dur:0.16}); },
  ramenSplash(){ nz({type:'bandpass',f:1600,f2:500,q:0.8,g:0.35,dur:0.32}); tn({type:'sine',f:900,f2:260,g:0.08,dur:0.12,when:0.02}); tn({type:'sine',f:1300,f2:500,g:0.05,dur:0.1,when:0.09}); },
  cola(){ nz({type:'highpass',f:2600,f2:6500,g:0.32,dur:0.8,a:0.02}); tn({type:'square',f:210,f2:70,g:0.14,dur:0.12,lp:900}); nz({type:'lowpass',f:900,f2:120,g:0.4,dur:0.3}); },
  burger(){ nz({type:'lowpass',f:320,f2:160,g:0.28,dur:0.9,a:0.05}); tn({type:'sine',f:120,f2:70,g:0.12,dur:0.5}); },
  pizza(){ if(!AC) return; const t=AC.currentTime; const os=AC.createOscillator(); os.type='sawtooth'; os.frequency.setValueAtTime(110,t); os.frequency.exponentialRampToValueAtTime(70,t+0.7); const lfo=AC.createOscillator(); lfo.frequency.value=26; const lg=AC.createGain(); lg.gain.value=30; lfo.connect(lg); lg.connect(os.frequency); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=2; const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.75); os.connect(f); f.connect(g); g.connect(master); os.start(t); lfo.start(t); os.stop(t+0.8); lfo.stop(t+0.8); },
  chickenFly(){ nz({type:'bandpass',f:300,f2:1200,q:0.9,g:0.25,dur:0.4}); },
  chickenLand(){ tn({type:'sine',f:85,f2:22,g:0.9,dur:0.7}); nz({type:'lowpass',f:700,f2:50,q:1,g:0.8,dur:0.6}); tn({type:'triangle',f:55,f2:28,g:0.5,dur:0.9}); for(let i=0;i<6;i++) nz({type:'highpass',f:2000,g:0.12,dur:0.04,when:0.05+i*0.04,rate:rand(0.7,1.5)}); },
  place(){ nz({type:'bandpass',f:2400,f2:1200,q:1.2,g:0.18,dur:0.12}); tn({type:'sine',f:180,f2:90,g:0.12,dur:0.1,when:0.03}); },
  refill(){ tn({type:'triangle',f:1046,g:0.12,dur:0.1}); tn({type:'triangle',f:1568,g:0.14,dur:0.22,when:0.08}); nz({type:'bandpass',f:2400,f2:1400,q:1.2,g:0.1,dur:0.1}); },
  broke(){ tn({type:'square',f:120,g:0.12,dur:0.1,lp:700}); tn({type:'square',f:100,g:0.12,dur:0.14,when:0.12,lp:700}); },
  fling(){ nz({type:'bandpass',f:500,f2:2400,g:0.22,dur:0.35}); },
  sniff(v){ v=v||0.05; const p=rand(0.8,1.3); nz({type:'bandpass',f:2000*p,f2:3200*p,q:3,g:v,dur:0.09}); nz({type:'bandpass',f:2200*p,f2:3600*p,q:3,g:v*1.2,dur:0.12,when:0.13}); },
  heuk(v){ v=v||0.05; const p=rand(1.1,1.7); tn({type:'sawtooth',f:300*p,f2:250*p,g:v,dur:0.16,lp:1300,q:4}); nz({type:'bandpass',f:1200,q:2,g:v*0.6,dur:0.08}); },
  door(){ tn({type:'sawtooth',f:180,f2:140,g:0.05,dur:0.5,lp:600,q:6}); nz({type:'bandpass',f:700,q:2,g:0.06,dur:0.4}); },
  doorClose(){ tn({type:'sine',f:160,f2:60,g:0.25,dur:0.14}); nz({type:'lowpass',f:1500,f2:200,g:0.2,dur:0.12}); },
  rattle(){ for(let i=0;i<4;i++){ nz({type:'bandpass',f:900,q:2,g:0.12,dur:0.05,when:i*0.09}); tn({type:'sine',f:140,f2:90,g:0.08,dur:0.05,when:i*0.09}); } },
  plop(){ tn({type:'sine',f:700,f2:180,g:0.3,dur:0.18}); nz({type:'lowpass',f:1200,g:0.1,dur:0.1}); },
  tearDrop(){ tn({type:'sine',f:1500,f2:600,g:0.22,dur:0.25}); tn({type:'sine',f:2200,f2:1000,g:0.08,dur:0.18,when:0.03}); },
  coin(){ tn({type:'triangle',f:1318,g:0.14,dur:0.12}); tn({type:'triangle',f:1760,g:0.14,dur:0.3,when:0.07}); },
  step(){ nz({type:'lowpass',f:600,f2:200,g:0.14,dur:0.08}); },
  click(){ tn({type:'triangle',f:900,f2:600,g:0.1,dur:0.06}); },
  patter(v){ nz({type:'bandpass',f:rand(1200,2600),q:1.5,g:v,dur:0.02}); },
  setMurmur(v){ if(!AC||!murmurG) return; murmurG.gain.setTargetAtTime(v,AC.currentTime,0.25); },

/* =========================================================
   RENDERER / SCENE / CAMERA / LIGHTS
   ========================================================= */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xF7EFDD);
const camera=new THREE.PerspectiveCamera(70, 1, 0.05, 30);
const camBase={pos:new V3(0,0.95,0.3), tgt:new V3(0,0.05,-2.0), fov:80};
const camCut={pos:new V3(0,2.3,1.85), tgt:new V3(0,0.0,-1.7), fov:80};
let camMix=0, camShake=0, camShakeT=0;
const isMobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);


// camView.play = height of the area above the item bar. The camera frames that area;
// the strip behind the bar is rendered as an extension below it.
const camView={w:1,h:1,play:1}, eyeV=new V3();
function barTopPx(){ const b=document.getElementById('bar'), c=b&&b.firstElementChild; return c? b.offsetTop+c.offsetTop : window.innerHeight; }
function setProj(playH){ camera.aspect=camView.w/playH; camera.setViewOffset(camView.w,playH,0,0,camView.w,camView.h); }
function eyeBottomPx(){
  camera.updateMatrixWorld(); let m=-1e9;
  for(const E of GI.eyes){ const pos=E.mesh.geometry.attributes.position; E.mesh.updateWorldMatrix(true,false);
    for(let i=0;i<pos.count;i++){ eyeV.fromBufferAttribute(pos,i).applyMatrix4(E.mesh.matrixWorld).project(camera); m=Math.max(m,(-eyeV.y*0.5+0.5)*camView.h); } }
  return m;
}
function layoutCamera(){
  const w=window.innerWidth, h=window.innerHeight;
  camView.w=w; camView.h=h; camView.play=Math.max(120, barTopPx()-4);
  renderer.setSize(w,h,false);
  const a=w/camView.play, p=clamp((a-0.48)/(1.75-0.48),0,1);
  camBase.fov=a>1.75? 2*Math.atan(Math.tan(33*Math.PI/180)*1.75/a)*180/Math.PI : lerp(81,66,p);
  camBase.pos.set(0,lerp(0.97,1.2,p),lerp(0.5,0.65,p));
  const pc=clamp((w/h-0.48)/(1.75-0.48),0,1);
  camCut.fov=lerp(82,64,pc); camCut.pos.set(0,lerp(2.30,2.60,pc),lerp(2.25,2.75,pc)); camCut.tgt.set(0,0.50,-1.45);
  // Tilt the play camera until the lower edge of the eyes sits right on top of the item bar.
  // If that pushes the top of the door frame off the screen, widen the view until it fits.
  // Always measure the eyes in the lying pose, even if the figure is standing in the cut scene.
  const R=GI.root, keepP=R.position.clone(), keepR=R.rotation.clone();
  R.position.set(0,0.17,0.735); R.rotation.set(-Math.PI/2,0,0);
  setProj(camView.play); camera.position.copy(camBase.pos);
  const topY=8;
  const aimEyes=fov=>{ camera.fov=fov; camera.updateProjectionMatrix(); let lo=-3, hi=1.5;
    for(let i=0;i<26;i++){ const mid=(lo+hi)/2; camera.lookAt(0,mid,-2.0); if(eyeBottomPx()>camView.play) hi=mid; else lo=mid; }
    camera.lookAt(0,(lo+hi)/2,-2.0); camera.updateMatrixWorld(); return (lo+hi)/2; };
  const doorTopY=()=>{ eyeV.set(0,CFG.DOOR.h+0.075,ROOM.z0-0.035).project(camera); return (-eyeV.y*0.5+0.5)*camView.h; };
  let ty=aimEyes(camBase.fov);
  if(doorTopY()<topY){ let flo=camBase.fov, fhi=110;
    for(let j=0;j<16;j++){ const fm=(flo+fhi)/2; aimEyes(fm); if(doorTopY()<topY) flo=fm; else fhi=fm; }
    camBase.fov=fhi; ty=aimEyes(fhi); }
  camBase.tgt.set(0,ty,-2.0);
  R.position.copy(keepP); R.rotation.copy(keepR); R.updateMatrixWorld(true);
  applyCamera();
}
function applyCamera(){
  const k=ease(clamp(camMix,0,1));
  camera.fov=lerp(camBase.fov,camCut.fov,k); setProj(lerp(camView.play,camView.h,k));
  tmpV.lerpVectors(camBase.pos,camCut.pos,k); tmpV2.lerpVectors(camBase.tgt,camCut.tgt,k);
  if(camShake>0.0005){ tmpV.x+=rand(-camShake,camShake); tmpV.y+=rand(-camShake,camShake)*0.6; }
  camera.position.copy(tmpV); camera.lookAt(tmpV2);
}

function surfacePatch(radii, dir, w, h, segs){
  const n=new V3(dir[0],dir[1],dir[2]).normalize();
  const t=new V3().crossVectors(new V3(0,1,0),n); if(t.lengthSq()<1e-6) t.set(1,0,0); t.normalize();
  const b=new V3().crossVectors(n,t).normalize();
  const R=(radii[0]+radii[1]+radii[2])/3;
  const pos=[], uv=[], nor=[], idx=[];
  for(let j=0;j<=segs;j++) for(let i=0;i<=segs;i++){
    const u=(i/segs-0.5)*w, v=(j/segs-0.5)*h;
    const d=new V3().copy(n).addScaledVector(t,u/R).addScaledVector(b,v/R).normalize();
    const p=new V3(d.x*radii[0],d.y*radii[1],d.z*radii[2]).multiplyScalar(1.004);
    const nn=new V3(d.x/radii[0],d.y/radii[1],d.z/radii[2]).normalize();
    pos.push(p.x,p.y,p.z); nor.push(nn.x,nn.y,nn.z); uv.push(i/segs,j/segs);
  }
  for(let j=0;j<segs;j++) for(let i=0;i<segs;i++){ const a=j*(segs+1)+i, b2=a+1, c=a+segs+1, d=c+1; idx.push(a,b2,c, b2,d,c); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); return g;
}

function groundY(x,z){
  let y=0;
  if(x>-0.52&&x<0.52&&z>-0.32&&z<1.82) y=0.06;
  if(x>-0.27&&x<0.27&&z>-0.2&&z<0.16){ const u=1-Math.max(Math.abs(x)/0.27,Math.abs(z-(-0.02))/0.18); y=0.06+0.05*clamp(u*2,0,1); }

}
function isStaticBlocked(x,z){
  if(x<ROOM.x0+0.05||x>ROOM.x1-0.05||z<ROOM.z0+0.02||z>ROOM.z1-0.05) return true;
  if(x>TABLE.x-TABLE.w/2-0.03&&x<TABLE.x+TABLE.w/2+0.03&&z>TABLE.z-TABLE.d/2-0.03&&z<TABLE.z+TABLE.d/2+0.03) return true;
  if(Math.hypot(x-LAUND.x,z-LAUND.z)<LAUND.r) return true;

  if(x>-0.27&&x<0.27&&z>0.2&&z<ROOM.z1) return true; // lying body
  return false;
}

      if(inHeadZone(e.x,e.z,0.055)) startEnter(e);
    }
    else if(e.state==='enter'){ e.anim+=dt*14; placeEntering(e); if(e.t>=CFG.ENTER_TIME) finishEnter(e); }
    else if(e.state==='fly'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.z+=e.vz*dt; e.vy-=7.5*dt; e.rx+=e.vrx*dt; e.ry+=e.vry*dt; e.rz+=e.vrz*dt; e.x=clamp(e.x,ROOM.x0+0.03,ROOM.x1-0.03); e.z=clamp(e.z,ROOM.z0+0.02,ROOM.z1-0.03);
      const gy=groundY(e.x,e.z), hy=headSurfaceY(e.x,e.z); if(e.y<=Math.max(gy,hy)){ if(hy>gy){ e.y=hy; startEnter(e); } else { e.y=gy; e.state='walk'; e.vx*=0.2; e.vz*=0.2; e.yaw=e.ry; e.t=0; } } }
    else if(e.state==='leave'){ e.scale=Math.max(0,e.scale-dt*1.6); e.y=groundY(e.x,e.z)+(1-e.scale)*0.02; if(e.scale<=0.02) removeEnemy(e); }
    else if(e.state==='wander'){ if(!e.tgt||e.t>rand(6,9)){ e.tgt=[rand(-1.3,1.3),rand(-3.2,-0.9)]; e.t=0; } let dx=e.tgt[0]-e.x, dz=e.tgt[1]-e.z; const d=Math.hypot(dx,dz); if(d<0.05){ e.tgt=null; continue; } dx/=d; dz/=d; const nx=e.x+(dx*e.speed+e.sx)*dt, nz=e.z+(dz*e.speed+e.sz)*dt; if(FF.isBase(nx,nz)){ e.tgt=null; continue; } e.vx=dx*e.speed; e.vz=dz*e.speed; e.x=nx; e.z=nz; e.y=groundY(e.x,e.z); e.anim+=dt*(e.speed*40+1.5); const ty=Math.atan2(e.vx,e.vz); let dd=ty-e.yaw; dd=Math.atan2(Math.sin(dd),Math.cos(dd)); e.yaw+=dd*Math.min(1,dt*6); }
  }
}
function updTowers(dt){
  for(const t of towers.slice()){
    t.pulse=Math.max(0,t.pulse-dt*4);
    if(t.ammo<=0){ removeTower(t); FF.rebuild(towers); continue; }
    t.cdT-=dt; if(t.cdT<=0&&!fireTower(t)) t.cdT=0.25;
  }
}

/* ---------- play update ---------- */
function updPlay(dt){
  G.t+=dt;
  while(G.spawnIdx<G.spawns.length&&G.spawns[G.spawnIdx].t<=G.t){ spawnEnemy({speed:G.plan.speed}); G.spawnIdx++; }
  updTowers(dt); updEnemies(dt); updProjs(dt); updZones(dt); updParts(dt);
  G.gnawPulse=Math.max(0,G.gnawPulse-dt*3);
  if(G.invaders){
    // Each one remains inside for this stage; there is no cleansing action.
    G.tear+=Math.min(CFG.MAX_EROSION,G.invaders*CFG.INNER_EROSION)*dt;
    if(Math.random()<dt*Math.min(4,G.invaders*0.14)) G.gnawPulse=Math.max(G.gnawPulse,0.28);
  }
  if(G.tear>=1){ G.tear=1; startCry(); return; }
  let walkers=0; for(const e of EN.list) if(e.state==='walk') walkers++;
  // Only the crowd already in the room can make a sound. No arrival cue.
  if(walkers>0&&Math.random()<Math.min(0.55,walkers*0.012)*dt*10){ Math.random()<0.55?SFX.sniff(0.03+Math.min(0.03,walkers*0.0004)):SFX.heuk(0.024); }
  if(walkers>6&&Math.random()<dt*Math.min(30,walkers*0.8)) SFX.patter(Math.min(0.05,0.008+walkers*0.0008));
  if(G.spawnIdx>=G.spawns.length){
    const alive=EN.list.filter(e=>e.alive&&e.state!=='leave').length;
    if(alive===0&&projs.length===0){ endRound(); }
    else G.stallT=0;
  }
}

/* ---------- cutscene (출근) ---------- */
const CUT_T={rise:0.85,turn:1.15,walkEnd:3.1,exit:3.65,back:5.45,inEnd:7.90,lieEnd:8.65};
function resetCommuteVisual(){
  const fade=$('dayFade'); if(fade) fade.style.opacity=0;
  windowPane.material.color.setHex(0x22346A); windowMoon.visible=true;

function cutPay(){ if(!CUT||CUT.paid) return; CUT.paid=true; G.money+=CFG.WAGE; SFX.coin(); floatMoney('+'+won(CFG.WAGE),'plus'); hudDirty=true; }
function updCut(dt){
  const c=CUT; c.t+=dt; const t=c.t, T=CUT_T;
  camMix=t<T.rise?clamp(t/T.rise,0,1):t>T.inEnd?1-clamp((t-T.inEnd)/(T.lieEnd-T.inEnd),0,1):1;
  const lieP=new V3(0,0.17,0.735), standP=new V3(0,0.86,0.91);
  if(t<T.rise){
    const k=easeOut(t/T.rise); GI.root.rotation.set(lerp(-Math.PI/2,0,k),0,0); GI.root.position.lerpVectors(lieP,standP,k);
    GI.legL.rotation.set(0,0,0.04*(1-k)); GI.legR.rotation.set(0,0,-0.04*(1-k)); GI.armL.rotation.set(lerp(-0.08,0.03,k),0,-lerp(0.24,0.17+GI.fat*0.1,k)); GI.armR.rotation.set(lerp(-0.08,0.03,k),0,lerp(0.24,0.17+GI.fat*0.1,k)); GI.elbowL.rotation.set(lerp(-0.10,-0.18,k),0,0.04); GI.elbowR.rotation.set(lerp(-0.10,-0.18,k),0,-0.04);
    GI.splay.visible=k<0.3; GI.lying=false; GI.workGear.visible=k>0.86;
  } else if(t<T.turn){
    GI.workGear.visible=true; const k=(t-T.rise)/(T.turn-T.rise); GI.stand(standP.x,standP.z,Math.PI*easeOut(k));
  } else if(t<T.exit){
    const k=clamp((t-T.turn)/(T.walkEnd-T.turn),0,1), k2=clamp((t-T.walkEnd)/(T.exit-T.walkEnd),0,1);
    GI.stand(lerp(0,0.10,k),t<T.walkEnd?lerp(standP.z,-3.10,k):lerp(-3.10,-4.75,k2),Math.PI);
    c.walkPh+=dt*13; GI.walkPose(c.walkPh,1);
    if(!c.doorOpened&&k>0.52){ c.doorOpened=true; doorTarget=1.48; SFX.door(); }
  } else if(t<T.back){
    GI.root.visible=false;
    if(!c.doorClosed){ c.doorClosed=true; doorTarget=0; SFX.doorClose(); G.round++; hudDirty=true; G.fat=Math.min(1,G.round*0.13); GI.setFat(G.fat); updHeadW(); }
    const k=clamp((t-T.exit)/(T.back-T.exit),0,1), hours=9*ease(k);
    clockHour.rotation.z=-(23+hours)*Math.PI/6; clockMinute.rotation.z=-hours*Math.PI*2;
    windowPane.material.color.setHex(0x22346A).lerp(new THREE.Color(0xE5BD91),ease(k)); windowMoon.visible=k<0.6;
    const fade=$('dayFade'); if(fade) fade.style.opacity=0.62*Math.pow(Math.sin(Math.PI*k),2);
  } else if(t<T.inEnd){
    const fade=$('dayFade'); if(fade) fade.style.opacity=0;
    if(!c.reopened){ c.reopened=true; doorTarget=1.48; SFX.door(); }
    const k=clamp((t-T.back-0.20)/(T.inEnd-T.back-0.20),0,1); GI.root.visible=true;
    GI.stand(lerp(0.10,0,k),lerp(-4.75,standP.z,k),0); c.walkPh+=dt*12; GI.walkPose(c.walkPh,k<0.97?0.80:0);
    if(k>0.28) cutPay();
    if(!c.closed2&&k>0.37){ c.closed2=true; doorTarget=DOOR_GAP; SFX.doorClose(); }
  } else if(t<T.lieEnd){
    const k=easeOut((t-T.inEnd)/(T.lieEnd-T.inEnd)); GI.workGear.visible=false;
    GI.root.rotation.set(lerp(0,-Math.PI/2,k),0,0); GI.root.position.lerpVectors(standP,lieP,k);
    GI.legL.rotation.set(0,0,0.04*k); GI.legR.rotation.set(0,0,-0.04*k); GI.armL.rotation.set(lerp(0.03,-0.08,k),0,-lerp(0.17+GI.fat*0.1,0.24,k)); GI.armR.rotation.set(lerp(0.03,-0.08,k),0,lerp(0.17+GI.fat*0.1,0.24,k)); GI.elbowL.rotation.set(lerp(-0.18,-0.10,k),0,0.04); GI.elbowR.rotation.set(lerp(-0.18,-0.10,k),0,-0.04); GI.splay.visible=k>0.8;
  } else finishCut();
}
function finishCut(){
  if(!CUT) return;
  if(!CUT.doorClosed){ G.round++; G.fat=Math.min(1,G.round*0.13); GI.setFat(G.fat); updHeadW(); }
  cutPay(); resetCommuteVisual(); GI.lie(); camMix=0; doorTarget=DOOR_GAP;
  hudDirty=true; CUT=null; startRound(G.round);
}

/* ---------- cry (game over) ---------- */
function updCry(dt){
  const c=CRY; c.t+=dt; const t=c.t;
  for(let i=EN.list.length-1;i>=0;i--){ const e=EN.list[i]; if(e.state==='enter'){ e.t+=dt; e.anim+=dt*14; placeEntering(e); if(e.t>=CFG.ENTER_TIME) finishEnter(e); } }
  for(let i=0;i<2;i++){ const B=beads[i], s=B.side; const cornerD=new V3(s*0.66,0.86,-0.12).normalize(), earD=new V3(s*0.98,-0.02,-0.08).normalize();
    if(t<0.6){ const k=t/0.6; B.mesh.visible=true; const p=surfPointW(cornerD); B.mesh.position.copy(p); B.mesh.scale.setScalar(0.004+k*0.006); }
    else if(t<1.9){ const k=easeIn((t-0.6)/1.3); const d=cornerD.clone().lerp(earD,k).normalize(); const p=surfPointW(d); B.mesh.position.copy(p); B.mesh.scale.setScalar(0.009);
      for(let j=0;j<B.trail.length;j++){ const kk=j/(B.trail.length-1)*k; if(kk<k-0.02){ const dd=cornerD.clone().lerp(earD,kk).normalize(); const pp=surfPointW(dd); const tr=B.trail[j]; tr.visible=true; tr.position.copy(pp); tr.scale.set(0.006,0.004,0.008); } } }
    else { if(!c.dropped[i]){ c.dropped[i]=true; SFX.plop(); B.mesh.visible=false; wetSpots[i].visible=true; } const k=clamp((t-1.9)/1.1,0,1); wetSpots[i].scale.setScalar(0.001+easeOut(k)*0.07); }
  }
  updParts(dt);
  if(t>3.4){ G.scene='over'; showGameOver(); }
}

/* ---------- placement ---------- */
const raycaster=new THREE.Raycaster(), floorPlane=new THREE.Plane(new V3(0,1,0),0), ndc=new THREE.Vector2();
let ghost=null, ghostId=null, ghostOk=false;
function ndcFrom(ev){ ndc.set((ev.clientX/window.innerWidth)*2-1,-(ev.clientY/window.innerHeight)*2+1); return ndc; }
function floorPoint(ev,out){ const br=barEl.getBoundingClientRect(); if(ev.clientX>=br.left-4&&ev.clientX<=br.right+4&&ev.clientY>=br.top-4&&ev.clientY<=br.bottom+4) return null; raycaster.setFromCamera(ndcFrom(ev),camera); const hit=raycaster.ray.intersectPlane(floorPlane,out||new V3()); if(!hit) return null; if(hit.x<ROOM.x0||hit.x>ROOM.x1||hit.z<ROOM.z0||hit.z>ROOM.z1) return null; return hit; }
function makeGhost(id){ const g=new THREE.Group(); const m=buildFood(id,true); m.traverse(o=>{ if(o.isMesh){ o.material=M.ghostOk; o.castShadow=false; o.receiveShadow=false; } }); g.add(m); g.userData.model=m; const f=FOOD_BY[id]; const ring=new THREE.Mesh(new THREE.RingGeometry(f.range-0.012,f.range,64),new THREE.MeshBasicMaterial({color:0x2FD06B,transparent:true,opacity:0.55,depthWrite:false,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=0.006; g.add(ring); g.userData.ring=ring; const foot=new THREE.Mesh(new THREE.CircleGeometry(f.foot+0.02,32),new THREE.MeshBasicMaterial({color:0x2FD06B,transparent:true,opacity:0.22,depthWrite:false})); foot.rotation.x=-Math.PI/2; foot.position.y=0.005; g.add(foot); g.userData.foot=foot; return g; }
let ghostKey='';

function moveGhost(pt,id){ if(!ghost||ghostId!==id){ hideGhost(); ghost=makeGhost(id); ghostId=id; scene.add(ghost); ghostKey=''; } ghost.visible=true; ghost.position.set(pt.x,groundY(pt.x,pt.z),pt.z); const key=Math.round(pt.x/0.03)+','+Math.round(pt.z/0.03); if(key!==ghostKey){ ghostKey=key; ghostOk=placeValid(id,pt.x,pt.z); } const ok=ghostOk&&G.money>=FOOD_BY[id].price; ghost.userData.model.traverse(o=>{ if(o.isMesh) o.material=ok?M.ghostOk:M.ghostNo; }); ghost.userData.ring.material.color.set(ok?0x2FD06B:0xE23744); ghost.userData.foot.material.color.set(ok?0x2FD06B:0xE23744); }
function hideGhost(){ if(ghost){ scene.remove(ghost); ghost.traverse(o=>{ if(o.geometry&&o!==ghost.userData.model) o.geometry.dispose(); }); ghost=null; ghostId=null; } }
const DOOR_KEEPOUT=1.0;
function placeValid(id,x,z,ignore=null){ const f=FOOD_BY[id]; if(x<ROOM.x0+f.foot+0.06||x>ROOM.x1-f.foot-0.06||z<ROOM.z0+DOOR_KEEPOUT+f.foot||z>ROOM.z1-f.foot-0.06) return false; if(Math.hypot(x,z)<CFG.HEAD_KEEPOUT+f.foot) return false;
  const r=f.foot+0.02; for(const [ox,oz] of [[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*0.7,r*0.7],[-r*0.7,r*0.7],[r*0.7,-r*0.7],[-r*0.7,-r*0.7]]) if(FF.isBase(x+ox,z+oz)) return false;
  for(const t of towers){ if(t!==ignore&&Math.hypot(t.x-x,t.z-z)<t.food.foot+f.foot+0.04) return false; }
  const ok=FF.testPlacement(x,z,f.foot,ignore?towers.filter(t=>t!==ignore):towers); FF.rebuild(towers); return ok; }
function placeTower(id,x,z){ const f=FOOD_BY[id]; G.money-=f.price; const t=makeTower(id,x,z); FF.rebuild(towers); hudDirty=true; return t; }
function tryPlace(id,pt){ if(G.scene!=='play') return false; const f=FOOD_BY[id]; if(!placeValid(id,pt.x,pt.z)){ SFX.broke(); return false; } if(G.money<f.price){ SFX.broke(); floatMoney('돈이 없어요','minus'); return false; } placeTower(id,pt.x,pt.z); SFX.place(); floatMoney('-'+won(f.price),'minus'); toastT=Math.min(toastT,0.5); return true; }
function pickTower(ev){ raycaster.setFromCamera(ndcFrom(ev),camera); const hits=raycaster.intersectObjects(towerG.children,true); for(const h of hits){ let o=h.object; while(o&&!o.userData.tower) o=o.parent; if(o&&o.userData.tower) return o.userData.tower; } return null; }

let last=performance.now(), eyeTick=0, tSec=0;
function step(dt){
  G.time+=dt;
  if(G.scene==='play') updPlay(dt);
  else if(G.scene==='cut') updCut(dt);
  else if(G.scene==='cry') updCry(dt);
  else if(G.scene==='title'){ updEnemies(dt); updParts(dt); }
  else if(G.scene==='over'){ updParts(dt); }
  // door
  if(doorRattle>0) doorRattle-=dt;
  const dTarget=doorTarget+(doorRattle>0?Math.sin(G.time*38)*0.035:0); doorAng+=(dTarget-doorAng)*Math.min(1,dt*6); doorHinge.rotation.y=-doorAng;
  if(camShakeT>0){ camShakeT-=dt; if(camShakeT<=0) camShake=0; }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity=0; }
}
function render(now){
  applyCamera();
  if(window.__fanBlades) window.__fanBlades.rotation.z+=0.016*10;
  syncEnemies(G.time); syncParts();
  for(const t of towers){ const s=1+t.pulse*0.12; t.full.scale.set(1/s,s,1/s); }
  eyeTick++; if(eyeTick%2===0||G.scene==='cry'){ const st={tear:G.scene==='cry'||G.scene==='over'?1:G.tear,blink:0,fat:G.fat,t:G.time,wob:Math.max(G.gnawPulse,(G.scene==='cry'||G.tear>0.85)?1:0)}; for(const E of GI.eyes) drawEye(E,st); }
  if(floorDirty){ floorDirtyT+=0.016; if(floorDirtyT>0.2){ floorTex.needsUpdate=true; floorDirty=false; floorDirtyT=0; } }
  if(hudDirty) updateHUD(); updateBadges(); updateBubbles(0.016);
  renderer.render(scene,camera);
}
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; step(dt); render(now); requestAnimationFrame(frame); }
async function boot(){
  paintFloorBase(); FF.rebuild(towers); buildBar(); updHeadW(); new ResizeObserver(()=>layoutCamera()).observe(barEl); updateHUD(); showBar(false); try{ renderer.compile(scene,camera); }catch(e){}
  try{ await Promise.race([document.fonts.load("900 20px 'Noto Sans KR'"), new Promise(r=>setTimeout(r,1200))]); }catch(e){}
  setThumbs();
  for(let i=0;i<4;i++){ const e=spawnEnemy({x:rand(-1.2,1.2),z:rand(-3.0,-1.2),state:'wander',speed:0.12}); }
  showTitle();
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
}
boot();

/* debug / balance hooks */
window.__dbg={ G, EN, get towers(){return towers;}, FF, CFG, FOODS, cam:camBase, camera, applyCamera, GI, scene, THREE, drawEye,
  start(r){ overlayEl.innerHTML=''; clearEnemies(); newRun(); startRound(r||0); },
  place(id,x,z){ return placeTower(id,x,z); }, valid:placeValid, spawn(n,o){ for(let i=0;i<n;i++) spawnEnemy(o||{speed:0.17}); }, tick(sec){ const st=1/60; for(let i=0;i<sec*60;i++) step(st); }, enter(e){ startEnter(e||EN.list[0]); }, cry(){ G.tear=1; }, cut(){ endRound(); }, skip:skipCut, render(){ render(performance.now()); },
  bot(maxRounds,skip){ const log=[]; skip=skip||[]; this._bad={}; overlayEl.innerHTML=''; clearEnemies(); newRun(); startRound(0);
    const plan=[['ramen',0.05,-2.4],['kimbap',-0.4,-2.0],['fries',0.45,-1.7],['cola',0.0,-1.2],['ramen',-0.45,-0.95],['kimbap',0.5,-0.85],['pizza',0.8,-1.85],['burger',-0.65,-2.4],['chicken',0.0,-0.7],['fries',-0.3,-1.55],['ramen',0.3,-2.45],['kimbap',-0.9,-1.1],['cola',-0.3,-0.6],['fries',0.35,-0.55],['ramen',-0.75,-2.0],['kimbap',0.9,-1.3],['pizza',-1.1,-2.3],['cola',0.55,-2.3],['burger',1.0,-0.7],['ramen',-0.2,-2.55]]; let guard=0, lastRound=-1, peak=0;
    while(guard++<600000){ const dt=1/30; if(EN.list.length>peak) peak=EN.list.length;
      if(G.scene==='play'){ if(G.round!==lastRound){ lastRound=G.round; log.push({round:G.round,money:G.money,kills:G.kills,towers:towers.length,peak}); peak=0; }
        for(const [id,x,z] of plan){ if(skip.includes(id)) continue; if(!towers.some(t=>Math.hypot(t.x-x,t.z-z)<0.05)){ const f=FOOD_BY[id]; const key=id+x+z; if(G.money>=f.price&&!this._bad?.[key]){ if(placeValid(id,x,z)) placeTower(id,x,z); else { this._bad=this._bad||{}; this._bad[key]=1; } } } }
        step(dt); }
      else if(G.scene==='cut'){ CUT.t=99; updCut(dt); }
      else if(G.scene==='cry'||G.scene==='over'){ log.push({dead:true,round:G.round,kills:G.kills,money:G.money}); return log; }
      if(G.round>=maxRounds){ log.push({survived:true,round:G.round,kills:G.kills,money:G.money}); return log; } }
    return log; }
};
