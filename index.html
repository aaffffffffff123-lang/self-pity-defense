<style>
:root{--ink:#24201E;--cream:#FFF4D6;--red:#E23744;--blue:#2F6BFF;--paper:#FFFFFF;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);font-family:'Noto Sans KR','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;touch-action:none;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#dangerVignette{position:absolute;inset:-8%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 52%,transparent 42%,rgba(116,0,15,.18) 68%,rgba(76,0,12,.72) 100%);transition:opacity .45s;mix-blend-mode:multiply}
#dangerVignette.lv1{opacity:.18}
#dangerVignette.lv2{opacity:.46;animation:dangerBeat 1.15s ease-in-out infinite}
#dangerVignette.lv3{opacity:.78;animation:dangerBeat .58s ease-in-out infinite}
@keyframes dangerBeat{0%,100%{transform:scale(1);filter:saturate(1)}16%{transform:scale(1.015);filter:saturate(1.45)}30%{transform:scale(1);filter:saturate(1)}}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 58px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;transition:opacity .3s}

#arcadeFace{position:fixed;left:calc(var(--sal) + 10px);top:calc(var(--sat) + 7px);width:44px;height:44px;padding:8px;line-height:0;z-index:20;opacity:.84;touch-action:manipulation;cursor:pointer}
#arcadeFace svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(1px 2px 1.5px #0006)}
#arcadeFace:active svg{transform:scale(.88)}
#arcadeFace:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#sndBtn{position:fixed;left:calc(var(--sal) + 62px);top:calc(var(--sat) + 7px);width:44px;height:44px;padding:0;border:0;border-radius:14px;background:rgba(255,255,255,.93);box-shadow:0 2px 0 rgba(90,60,0,.12);display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;touch-action:manipulation}
#sndBtn svg{width:24px;height:24px;display:block}
#sndBtn .x{display:none;stroke:var(--red)}
#sndBtn.off .x{display:block} #sndBtn.off .w{display:none}
#sndBtn:active svg{transform:scale(.88)}
#sndBtn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#hud{padding-left:calc(var(--sal) + 116px)}
.pill{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;line-height:1.25;box-shadow:0 2px 0 rgba(90,60,0,.12)}
.pill small{display:block;font-size:11px;font-weight:500;opacity:.6}
#hudMoney{font-size:19px;font-weight:900;position:relative;min-width:110px;text-align:right}
#hudMoney.broke{color:var(--red)}
#hudDebt{color:var(--red);opacity:.85!important;font-size:11px;font-weight:800;display:none!important}
#hudDebt.on{display:block!important}
.fl{position:absolute;right:10px;top:-8px;font-size:14px;font-weight:800;animation:fl 1.2s ease-out forwards;white-space:nowrap}
.fl.minus{color:var(--red)}.fl.plus{color:#1E8A4B}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px calc(var(--sar) + 6px) calc(var(--sab) + 8px) calc(var(--sal) + 6px);display:flex;justify-content:center;align-items:flex-end;gap:5px;background:linear-gradient(to top,rgba(255,244,214,.97) 60%,rgba(255,244,214,0));pointer-events:none;transition:opacity .3s,transform .3s}
#bar.off{opacity:0;transform:translateY(30px);pointer-events:none}
.card{pointer-events:auto;width:min(13vw,92px,16vh);background:var(--paper);border-radius:12px;padding:5px 3px 4px;text-align:center;box-shadow:0 2px 0 rgba(90,60,0,.14);border:2px solid transparent;cursor:grab;transition:transform .12s,opacity .2s;position:relative}
.card img{width:76%;aspect-ratio:1;display:block;margin:0 auto;pointer-events:none}
.card .nm{font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap}
.card .pr{font-size:11px;font-weight:900;color:var(--red);line-height:1.1;margin-top:2px}
.card .am{font-size:10px;opacity:.55;line-height:1.1}
.card.sel{border-color:var(--red);transform:translateY(-6px)}
.card.no{opacity:.45}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 0 rgba(90,60,0,.15);pointer-events:none}
.ammoBadge{font-size:10px;opacity:.55;padding:1px 6px;transition:opacity .15s,color .15s,background .15s}
.ammoBadge.low{opacity:1;color:var(--red);background:#FFF1E8;box-shadow:0 2px 0 rgba(226,55,68,.18)}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);background:rgba(255,255,255,.96);color:var(--ink);padding:9px 16px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 0 rgba(90,60,0,.14)}
#cutCaption{position:absolute;left:50%;bottom:calc(var(--sab) + 78px);z-index:17;max-width:min(calc(100vw - 32px),420px);transform:translate(-50%,10px);padding:8px 14px;border-radius:9px;background:rgba(20,18,17,.82);color:#fff;font-size:14px;font-weight:700;line-height:1.4;text-align:center;white-space:nowrap;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;text-shadow:0 1px 1px #000}
#cutCaption.on{opacity:1;transform:translate(-50%,0)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
/* a text arriving on the phone: the usual notification card, under the top bar */
#sms{position:absolute;left:50%;top:calc(var(--sat) + 60px);width:min(calc(100vw - 24px),360px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:rgba(255,255,255,.97);border-radius:16px;padding:9px 13px 10px;box-shadow:0 8px 22px rgba(36,32,30,.16),0 1px 0 rgba(36,32,30,.08);transition:opacity .25s,transform .25s;z-index:18;text-align:left}
#sms.on{opacity:1;transform:translate(-50%,0)}
#sms .smsHead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:rgba(36,32,30,.5);margin-bottom:3px}
#sms .smsHead::before{content:"";width:15px;height:15px;border-radius:4px;background:#34C759;flex:none}
#sms .smsFrom{color:var(--ink);font-weight:800}
#sms .smsTime{margin-left:auto;font-weight:500}
#sms .smsBody{font-size:13px;font-weight:600;line-height:1.45;white-space:pre-line;color:var(--ink);word-break:keep-all}
#sms.on ~ #toast{top:calc(var(--sat) + 150px)}
#toast.wrap{white-space:normal;width:min(calc(100vw - 32px),360px);text-align:center;line-height:1.45}
#firstPlaceHint{position:absolute;left:50%;bottom:calc(var(--sab) + clamp(105px,17vh,142px));z-index:18;transform:translate(-50%,8px);padding:8px 14px 9px;border-radius:13px;background:rgba(36,32,30,.94);color:#fff;font-size:13px;font-weight:800;line-height:1.3;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#firstPlaceHint::after{content:"↓";position:absolute;left:50%;top:100%;transform:translateX(-50%);color:#E23744;font-size:28px;line-height:1;animation:firstPlaceBob .75s ease-in-out infinite alternate}
#firstPlaceHint.on{opacity:1;transform:translate(-50%,0)}
@keyframes firstPlaceBob{from{transform:translate(-50%,0)}to{transform:translate(-50%,8px)}}
/* calling a cleaning crew: bottom left, across from the ultimate */
#cleanBtn{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + clamp(100px,16vh,136px));z-index:16;min-width:84px;min-height:48px;border:0;border-radius:14px;padding:7px 12px 8px;background:rgba(255,255,255,.95);color:var(--ink);font:800 12px/1.25 'Noto Sans KR',sans-serif;box-shadow:0 2px 0 rgba(90,60,0,.14);display:none;flex-direction:column;align-items:flex-start;gap:1px;touch-action:manipulation;cursor:pointer;text-align:left}
#cleanBtn.on{display:flex}
#cleanBtn .cl2{font-size:16px;font-weight:900;color:var(--red)}
#cleanBtn.poor{opacity:.55}
#cleanBtn.poor .cl2{opacity:1}
#cleanBtn.armed{background:var(--ink);color:#fff}
#cleanBtn.armed .cl2{color:#FFD447}
#cleanBtn.booked{opacity:.8;pointer-events:none}
#cleanBtn.booked .cl2{color:var(--ink);font-size:13px}
#cleanBtn.warn{animation:cleanPulse 1.1s ease-in-out infinite}
#cleanBtn:active{transform:scale(.96)}
@keyframes cleanPulse{0%,100%{transform:none;box-shadow:0 2px 0 rgba(90,60,0,.14)}50%{transform:scale(1.08);box-shadow:0 0 0 4px rgba(226,55,68,.28)}}
/* actual loan control: a DOM speech bubble tethered to the phone, above food and the ultimate */
#loanWrap{--tail:50%;position:absolute;z-index:19;display:none;transform:translate(-50%,-100%);pointer-events:auto;filter:drop-shadow(0 3px 8px rgba(36,32,30,.18))}
#loanWrap.on{display:block}
#loanWrap::after{content:"";position:absolute;left:var(--tail);top:calc(100% - 1px);margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff;filter:drop-shadow(0 1px 0 rgba(47,107,255,.38))}
#loanBtn{min-width:88px;min-height:48px;border:1px solid rgba(47,107,255,.42);border-radius:14px;padding:7px 12px 8px;background:rgba(255,255,255,.97);color:#1748B5;font:800 12px/1.2 'Noto Sans KR',sans-serif;box-shadow:0 0 0 3px rgba(47,107,255,.14);display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;touch-action:manipulation}
#loanBtn .ln2{font-size:15px;font-weight:900;color:#2F6BFF}
#loanBtn:active{transform:scale(.96)}
#loanWrap.open #loanBtn{background:#1748B5;color:#fff;box-shadow:0 0 0 3px rgba(47,107,255,.24)}
#loanWrap.open #loanBtn .ln2{color:#DCE7FF}
#loanChoices{position:absolute;left:50%;bottom:calc(100% + 9px);width:196px;transform:translateX(-50%);display:none;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px;border-radius:14px;background:rgba(255,255,255,.98);box-shadow:0 4px 16px rgba(36,32,30,.2)}
#loanWrap.open #loanChoices{display:grid}
#loanTerms{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:2px 3px 5px;text-align:center;color:#4E5665;font:800 11px/1.25 'Noto Sans KR',sans-serif}
#loanTerms b{color:#1748B5;font-size:13px}
#loanTerms small{font-size:10px;font-weight:700;color:#6B7280}
#loanChoices button{min-height:40px;border:1px solid rgba(47,107,255,.22);border-radius:10px;background:#EEF3FF;color:#1748B5;font:900 14px/1 'Noto Sans KR',sans-serif;cursor:pointer;touch-action:manipulation}
#loanChoices button:active{transform:scale(.95);background:#DCE7FF}
#loanChoices button:disabled{opacity:.34;filter:grayscale(.45);cursor:not-allowed;transform:none;background:#E7E9EE;color:#777}
.box{pointer-events:auto;background:rgba(255,255,255,.97);border-radius:24px;padding:26px 30px 24px;text-align:center;box-shadow:0 6px 0 rgba(90,60,0,.16);min-width:min(82vw,340px)}
.box h1{margin:0 0 4px;font-size:38px;font-weight:900;letter-spacing:-1.5px;line-height:1.08}
.box h1 span{color:var(--red)}
.box p{margin:6px 0 18px;font-size:14px;font-weight:500;opacity:.78;line-height:1.5}
.box .st{font-size:15px;font-weight:700;margin:0 0 18px;line-height:1.7}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:17px;padding:12px 28px;border-radius:14px;cursor:pointer;margin:4px 3px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.gameOverBox{position:absolute;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);min-width:0;padding:9px 10px;border-radius:17px;white-space:nowrap}
.gameOverBox .btn{font-size:14px;min-height:44px;padding:9px 14px;border-radius:11px;margin:2px;display:inline-flex;align-items:center}
.gameOverRec{font-size:12px;font-weight:800;opacity:.7;margin:1px 4px 5px}
#cutSkip{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 16px);z-index:15;min-height:44px;border:0;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.78);color:var(--ink);font:700 12px/1 'Noto Sans KR',sans-serif;box-shadow:0 2px 0 rgba(90,60,0,.12);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;touch-action:manipulation}
#cutSkip.on{opacity:.82;pointer-events:auto;transform:none}
#cutSkip:active{transform:scale(.96)}
#ultWrap{--d:clamp(70px,19vw,86px);position:absolute;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + clamp(92px,16vh,132px));width:var(--d);height:var(--d);z-index:16;pointer-events:none}
#ultFx{position:absolute;left:calc(var(--d) * -1.1);top:calc(var(--d) * -2.3);width:calc(var(--d) * 3.2);height:calc(var(--d) * 4.2);pointer-events:none}
#selfHitBtn{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:50%;background:none;color:inherit;opacity:0;transform:scale(.55);transition:opacity .22s,transform .22s;touch-action:manipulation;cursor:pointer;pointer-events:none;outline:none}
#selfHitBtn svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#ultWrap.on #selfHitBtn{opacity:1;transform:none}
#ultWrap.ready #selfHitBtn{pointer-events:auto;animation:ultIdle 1.15s ease-in-out infinite}
#ultWrap.pop #selfHitBtn{animation:ultPop .62s cubic-bezier(.2,.9,.3,1) both}
#ultWrap.boom #selfHitBtn{animation:ultBoom .42s ease-out forwards}
#selfHitBtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#selfHitBtn .seg{opacity:0;transition:opacity .25s}
#selfHitBtn .seg.lit{opacity:1}
#selfHitBtn .seg.just{animation:ultSeg .5s ease-out}
#selfHitBtn .discHot,#selfHitBtn .orbit,#selfHitBtn .fistHot{opacity:0;transition:opacity .2s}
#ultWrap.ready #selfHitBtn .discHot,#ultWrap.ready #selfHitBtn .orbit,#ultWrap.ready #selfHitBtn .fistHot{opacity:1}
#ultWrap.ready #selfHitBtn .discHot{animation:ultHeat .5s ease-in-out infinite alternate}
#selfHitBtn .orbit{animation:ultOrbit 1.05s linear infinite}
#selfHitBtn .flash{opacity:0}
#ultWrap.pop #selfHitBtn .flash{animation:ultFlash .5s ease-out}
#ultWrap.boom #selfHitBtn .flash{animation:ultFlash .38s ease-out}
@keyframes ultIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ultPop{0%{transform:scale(.45)}38%{transform:scale(1.34)}62%{transform:scale(.9)}82%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes ultBoom{0%{transform:scale(1);opacity:1}30%{transform:scale(1.36);opacity:1}100%{transform:scale(1.75);opacity:0}}
@keyframes ultSeg{0%{filter:brightness(3)}100%{filter:none}}
@keyframes ultHeat{from{opacity:.82}to{opacity:1}}
@keyframes ultOrbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-276.46}}
@keyframes ultFlash{0%{opacity:.95}100%{opacity:0}}
#ultScr{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--ux,80%) var(--uy,75%),rgba(255,236,190,.62),rgba(255,138,30,.3) 22%,rgba(255,80,0,.1) 46%,rgba(255,60,0,0) 70%)}
#ultScr.go{animation:ultScr .5s ease-out}
@keyframes ultScr{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#hud.hush,#labels.hush{opacity:0;transition:opacity .5s}
#labels{transition:opacity .3s}
.webglError{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream);text-align:center}
.hide{display:none!important}
 
#dayFade{position:absolute;inset:0;background:#13151e;opacity:0;pointer-events:none}
#hudRound{font-size:17px;padding:5px 6px 5px 12px;display:flex;align-items:center;gap:7px;pointer-events:auto}
#tearMeter{--tail:50%;position:absolute;left:50%;top:65%;width:clamp(88px,25vw,104px);padding:4px;border:1px solid rgba(36,32,30,.12);border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 2px 0 rgba(90,60,0,.12);line-height:1;pointer-events:none;opacity:0;transform:translate(-50%,-100%) scale(.94);transform-origin:50% 100%;transition:opacity .15s,transform .15s,background .18s}
#tearMeter::after{content:"";position:absolute;left:var(--tail);top:100%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid rgba(255,255,255,.94)}
#tearMeter.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.tearTrack{display:block;height:7px;overflow:hidden;border-radius:99px;background:rgba(36,32,30,.13)}
#tearFill{display:block;width:100%;height:100%;border-radius:inherit;background:#53A8E2;transform:scaleX(0);transform-origin:left center;transition:transform .12s linear,background .2s}
#tearMeter.warn #tearFill{background:#E7A51B}
#tearMeter.danger #tearFill{background:#E9633F}
#tearMeter.critical{background:#FFF0EE;animation:tearMeterBeat .58s ease-in-out infinite}
#tearMeter.critical::after{border-top-color:#FFF0EE}
#tearMeter.critical #tearFill{background:var(--red)}
@keyframes tearMeterBeat{0%,100%{transform:translate(-50%,-100%) scale(1)}18%{transform:translate(-50%,-100%) scale(1.035)}}
#pauseBtn{display:none;width:28px;height:28px;padding:0;border:0;border-radius:9px;background:rgba(36,32,30,.08);color:var(--ink);align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation}
#pauseBtn.on{display:flex}
#pauseBtn i{display:block;width:3px;height:13px;border-radius:2px;background:currentColor}
#pauseBtn:active{transform:scale(.92)}
#pauseBtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#pauseShade{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(19,21,30,.58);backdrop-filter:blur(2px);pointer-events:auto}
#pauseShade.on{display:flex}
#pauseShade .pauseBox{min-width:min(74vw,260px);padding:22px 24px 20px;border-radius:20px;background:rgba(255,255,255,.97);box-shadow:0 6px 0 rgba(36,32,30,.22);text-align:center}
#pauseShade .pauseTitle{font-size:25px;font-weight:900;margin-bottom:14px}
#resumeBtn{border:0;border-radius:13px;padding:11px 26px;background:var(--ink);color:#fff;font:800 16px/1 'Noto Sans KR',sans-serif;cursor:pointer;touch-action:manipulation}
#resumeBtn:active{transform:scale(.96)}
body.gamePaused #app *,body.gamePaused #app *::before,body.gamePaused #app *::after{animation-play-state:paused!important}
.card .role{position:static;transform:none;background:none;color:var(--ink);padding:0;font-size:10px;line-height:1.1;white-space:nowrap;display:none;opacity:.62;pointer-events:none}
.card.sel .am{display:none}
.card.sel .role{display:block}
#bar.off .card{pointer-events:none}



.titleBox{background:none;box-shadow:none;padding:0 0 10px;display:flex;flex-direction:column;align-items:center}
.logo{display:block;width:min(94vw,480px,72vh);height:auto;overflow:visible;margin:0 auto 8px;animation:lgPop .6s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 7px 0 rgba(36,32,30,.22))}
.logo .lgFlag{animation:lgWave 1.8s ease-in-out infinite alternate}
.logo .lgGlint{animation:lgGlint 3.6s ease-in-out 1s infinite}
@keyframes lgPop{0%{transform:translateY(-40px) scale(1.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes lgWave{from{transform:skewY(-4deg) scaleX(.94)}to{transform:skewY(5deg) scaleX(1.04)}}
@keyframes lgGlint{0%{transform:skewX(-20deg) translateX(0)}45%,100%{transform:skewX(-20deg) translateX(560px)}}
.titleBox .btn{font-size:21px;padding:13px 40px;border-radius:16px;box-shadow:0 5px 0 rgba(36,32,30,.35)}




.speech{border:1px solid rgba(36,32,30,.16);background:#fff;box-shadow:0 2px 0 rgba(36,32,30,.08);padding:4px 9px!important;max-width:calc(100vw - 24px)}
.speech::after{content:"";position:absolute;left:var(--tail,50%);top:100%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 1px 0 rgba(36,32,30,.18))}

.speech.chatter{border-color:rgba(36,32,30,.38);border-radius:999px;padding:4px 10px!important;font-family:'Gaegu','Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.05;letter-spacing:.1px;text-align:left;box-shadow:0 2px 0 rgba(36,32,30,.1),0 4px 10px rgba(36,32,30,.06)}
.speech.chatter::before{content:attr(data-full);display:block;visibility:hidden;white-space:nowrap}
.speech.chatter .chatterText{position:absolute;left:10px;top:50%;transform:translateY(-52%);white-space:nowrap}
.speech.chatter::after{top:calc(100% - 1px);margin-left:-5px;border-left-width:5px;border-right-width:5px;border-top-width:7px;filter:drop-shadow(0 1px 0 rgba(36,32,30,.35))}
.box h1{margin-bottom:20px}
@media (max-width:360px){
  #bar{gap:2px;padding-left:calc(var(--sal) + 3px);padding-right:calc(var(--sar) + 3px)}
  .card{padding-left:1px;padding-right:1px;border-radius:10px}
  .card .nm{font-size:clamp(8px,2.5vw,10px);letter-spacing:-.8px}
  .card .pr{font-size:9px;letter-spacing:-.4px}
  .card .am,.card .role{font-size:8px}
}

let lastSplat=0, splatN=0;
// 소리 켜기/끄기 버튼 (PC는 M 키). 새로 열 때마다 켜진 상태로 시작합니다.
let muted=false, gamePaused=false;


const ACTIVE_TALK=new Set();
const TALK_TIME={syl:.072,space:.05,punct:.17};

function talkSteps(text,speed=1){
  const steps=[]; let t=0;
  for(const ch of Array.from(String(text))){
    const kind=/\s/.test(ch)?'space':/[.,!?…~]/.test(ch)?'punct':'syl';
    steps.push({ch,kind,t});
    t+=TALK_TIME[kind]/speed;
  }
  return {steps,total:t};
}

const TALK_VOWEL={
  a:[820,1320],e:[540,1900],eo:[640,1060],
  o:[470,860],u:[370,900],eu:[410,1450],i:[310,2400]
};
const TALK_JUNG=['a','e','a','e','eo','e','eo','e','o','a','e','e','o','u','eo','e','i','u','eu','i','i'];
const TALK_CHO=['stop','stop','nasal','stop','stop','liquid','nasal','stop','stop','hiss','hiss','none','hiss','hiss','hiss','stop','stop','stop','breath'];

function talkSound(ch){
  const cp=ch.codePointAt(0);
  if(cp<0xAC00||cp>0xD7A3) return {v:'eu',on:'none',coda:false};
  const k=cp-0xAC00;
  return {
    v:TALK_JUNG[Math.floor((k%588)/28)],
    on:TALK_CHO[Math.floor(k/588)],
    coda:k%28!==0
  };
}

function animalTalk(text,o={}){
  const speed=o.speed||1;
  const plan=talkSteps(text,speed);
  const silent={...plan,t0:null,stop(){}};

  if(!AC||!master||!noiseBuf||muted||AC.state==='closed') return silent;

  const pitch=o.pitch||620;
  const formant=o.formant||1.4;
  const gain=Math.max(0,Math.min(.025,o.gain??.018));
  const t0=AC.currentTime+.018;
  const out=AC.createGain();
  const live=new Set();

  let closed=false;
  let stopping=false;
  let handle;

  out.gain.value=gain;
  out.connect(talkBus||master);

  function finish(){
    if(closed) return;
    closed=true;
    try{ out.disconnect(); }catch(e){}
    live.clear();
    ACTIVE_TALK.delete(handle);
  }

  function track(src){
    live.add(src);
    src.onended=()=>{
      live.delete(src);
      try{ src.disconnect(); }catch(e){}
      if(!live.size) finish();
    };
  }

  function stop(hard=false){
    if(closed||(stopping&&!hard)) return;
    stopping=true;
    const now=AC.currentTime;

    if(hard){
      try{
        out.gain.cancelScheduledValues(now);
        out.gain.setValueAtTime(0,now);
      }catch(e){}

      for(const src of [...live]){
        src.onended=null;
        try{ src.stop(now); }catch(e){}
        try{ src.disconnect(); }catch(e){}
      }
      finish();
      return;
    }

    try{
      out.gain.cancelScheduledValues(now);
      out.gain.setValueAtTime(Math.max(.0001,out.gain.value),now);
      out.gain.exponentialRampToValueAtTime(.0001,now+.025);
    }catch(e){}

    for(const src of [...live]){
      try{ src.stop(now+.03); }catch(e){}
    }
    if(!live.size) finish();
  }

  handle={...plan,t0,stop};
  ACTIVE_TALK.add(handle);

  const syllables=plan.steps.filter(s=>s.kind==='syl');
  const ask=/\?\s*$/.test(String(text));

  syllables.forEach((st,i)=>{
    const S=talkSound(st.ch);
    const F=TALK_VOWEL[S.v];
    const t=t0+st.t;

    let pm=1+.045*Math.sin(i*1.9+pitch*.013)+(Math.random()-.5)*.04;
    if(S.v==='i') pm*=1.05;
    else if(S.v==='o'||S.v==='u') pm*=.96;
    if(i===syllables.length-1) pm*=ask?1.16:.92;

    let vt=t;

    if(S.on==='hiss'||S.on==='breath'||S.on==='stop'){
      const src=AC.createBufferSource();
      const f=AC.createBiquadFilter();
      const g=AC.createGain();
      const len=S.on==='stop'?.008:S.on==='hiss'?.022:.016;

      src.buffer=noiseBuf;
      f.type=S.on==='hiss'?'highpass':'bandpass';
      f.frequency.value=S.on==='hiss'?4800:S.on==='stop'?2600:1700;
      f.Q.value=S.on==='hiss'?.7:1.1;

      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(
        S.on==='stop'?.35:S.on==='hiss'?.2:.14,
        t+.002
      );
      g.gain.exponentialRampToValueAtTime(.0001,t+len);

      src.connect(f);
      f.connect(g);
      g.connect(out);
      track(src);

      src.start(t,Math.random()*Math.max(.01,noiseBuf.duration-.05));
      src.stop(t+len+.015);

      if(S.on!=='stop') vt=t+len*.5;
    }

    const len=Math.max(
      .026,
      TALK_TIME.syl/speed*(S.coda?.68:.82)-(vt-t)
    );

    const src=AC.createOscillator();
    const b1=AC.createBiquadFilter();
    const b2=AC.createBiquadFilter();
    const g1=AC.createGain();
    const g2=AC.createGain();
    const env=AC.createGain();

    src.type='sawtooth';
    src.frequency.setValueAtTime(
      pitch*pm*(S.on==='liquid'?.96:1.06),
      vt
    );
    src.frequency.exponentialRampToValueAtTime(pitch*pm*.98,vt+len);

    b1.type=b2.type='bandpass';
    b1.frequency.value=F[0]*formant;
    b1.Q.value=4;
    b2.frequency.value=F[1]*formant;
    b2.Q.value=6;
    g1.gain.value=1;
    g2.gain.value=S.on==='nasal'?.32:.68;

    env.gain.setValueAtTime(.0001,vt);
    env.gain.exponentialRampToValueAtTime(1,vt+.005);
    env.gain.setValueAtTime(1,vt+len*.58);
    env.gain.exponentialRampToValueAtTime(.0001,vt+len);

    src.connect(b1);
    b1.connect(g1);
    g1.connect(env);
    src.connect(b2);
    b2.connect(g2);
    g2.connect(env);
    env.connect(out);
    track(src);

    src.start(vt);
    src.stop(vt+len+.015);
  });

  if(!live.size) finish();
  return handle;
}

function stopAllAnimalTalk(hard=false){
  for(const voice of [...ACTIVE_TALK]) voice.stop(hard);
}

  // 머릿속으로 비집고 들어갈 때의 부드럽고 불쾌한 마찰음
  enterWet(count,pressure,depth,pan,hard=false){
    if(!AC||!master||!noiseBuf) return;
    if(!this._enterWet&&!count) return;

    if(!this._enterWet){
      const out=AC.createGain();
      out.gain.value=0;

      const panner=AC.createStereoPanner
        ? AC.createStereoPanner()
        : null;

      if(panner){
        panner.pan.value=0;
        out.connect(panner);
        panner.connect(master);
      } else {
        out.connect(master);
      }

      // 살갗을 문지르며 미끄러지는 낮은 마찰음
      const src=AC.createBufferSource();
      const rub=AC.createBiquadFilter();
      const soft=AC.createBiquadFilter();
      const rubG=AC.createGain();

      src.buffer=noiseBuf;
      src.loop=true;
      src.playbackRate.value=0.82;

      rub.type='bandpass';
      rub.frequency.value=620;
      rub.Q.value=0.75;

      soft.type='lowpass';
      soft.frequency.value=1050;
      soft.Q.value=0.65;

      rubG.gain.value=0.78;

      src.connect(rub);
      rub.connect(soft);
      soft.connect(rubG);
      rubG.connect(out);

      // 안쪽으로 눌려 들어가는 낮은 울림
      const tone=AC.createOscillator();
      const toneF=AC.createBiquadFilter();
      const toneG=AC.createGain();
      const wob=AC.createOscillator();
      const wobG=AC.createGain();

      tone.type='triangle';
      tone.frequency.value=104;

      toneF.type='lowpass';
      toneF.frequency.value=260;

      toneG.gain.value=0.28;

      wob.type='sine';
      wob.frequency.value=4.7;
      wobG.gain.value=3.2;

      wob.connect(wobG);
      wobG.connect(tone.frequency);
      tone.connect(toneF);
      toneF.connect(toneG);
      toneG.connect(out);

      src.start(0,Math.random()*noiseBuf.duration);
      tone.start();
      wob.start();

      this._enterWet={
        out,panner,rub,soft,tone,
        src,wob
      };
    }

    const s=this._enterWet;
    const now=AC.currentTime;

    const aim=(param,value,time)=>{
      if(hard){
        param.cancelScheduledValues(now);
        param.setValueAtTime(value,now);
        return;
      }

      if(param.cancelAndHoldAtTime){
        param.cancelAndHoldAtTime(now);
      } else {
        param.cancelScheduledValues(now);
        param.setValueAtTime(param.value,now);
      }

      param.setTargetAtTime(value,now,time);
    };

    // 여러 명이 동시에 들어가도 소리가 무한히 커지지 않게 제한
    const crowd=count ? 1+0.26*Math.log2(count) : 0;
    const volume=count
      ? Math.min(0.065,0.04*pressure*crowd)
      : 0;

    aim(s.out.gain,volume,count?0.035:0.075);
    aim(s.rub.frequency,lerp(720,310,depth),0.045);
    aim(s.soft.frequency,lerp(1250,560,depth),0.055);
    aim(s.tone.frequency,lerp(108,68,depth),0.05);

    if(s.panner){
      aim(s.panner.pan,clamp(pan,-0.55,0.55),0.07);
    }
  },

  setMurmur(v){ if(!AC||!murmurG) return; murmurG.gain.setTargetAtTime(v,AC.currentTime,0.25); },

/* ---------- flies ----------
   A fly sits on its rotten lump for a few seconds, takes off for a short loop and lands again.
   Only the ones in the air are heard: the three nearest the camera get a voice each, panned to where
   they are on screen, so the room sounds dirty without a drone sitting on top of everything else. */
const FLYSND={voices:[],bus:null,duck:1,LEVEL:0.0068};
function flyBus(){ if(!AC) return null; if(!FLYSND.bus){ const g=AC.createGain(); g.gain.value=1; g.connect(master); FLYSND.bus=g; } return FLYSND.bus; }
function makeFlyVoice(i){
  const out=AC.createGain(); out.gain.value=0;
  let pan=null; if(AC.createStereoPanner){ pan=AC.createStereoPanner(); out.connect(pan); pan.connect(flyBus()); } else out.connect(flyBus());
  const f0=[214,239,193][i%3], os=AC.createOscillator(); os.type='sawtooth'; os.frequency.value=f0;
  // wing beat wobble and flutter
  const vib=AC.createOscillator(); vib.frequency.value=rand(7,10); const vg=AC.createGain(); vg.gain.value=f0*0.03; vib.connect(vg); vg.connect(os.frequency);
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=420; hp.Q.value=0.6;
  const pk=AC.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=2200; pk.Q.value=1.1; pk.gain.value=4;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; lp.Q.value=0.5;
  const am=AC.createGain(); am.gain.value=0.78; const fl=AC.createOscillator(); fl.frequency.value=rand(11,17); const flg=AC.createGain(); flg.gain.value=0.22; fl.connect(flg); flg.connect(am.gain);
  os.connect(hp); hp.connect(pk); pk.connect(lp); lp.connect(am); am.connect(out);
  os.start(); vib.start(); fl.start();
  return {out,pan,os,f0};
}
const flyCand=[];
function updFlySound(){
  if(!AC||muted||AC.state!=='running') return;
  if(!FLYSND.voices.length) for(let i=0;i<3;i++) FLYSND.voices.push(makeFlyVoice(i));
  flyCand.length=0;
  const cand=f=>{ if(f.k<0.04||!f.pos) return; const d=camera.position.distanceTo(f.pos); flyCand.push({f,w:f.k*clamp(0.75/d,0.25,0.7)}); };
  for(const L of lumps) for(const f of L.flies) cand(f);
  for(const H of rotHosts) for(const f of H.flies) cand(f);

// A small self enters head-first and disappears beneath the skin.
function startEnter(e){
  if(!e||e.state==='enter'||!e.alive) return;
  e.state='enter'; e.t=0; e.scale=1;
  e.enterFrom=new V3(e.x,e.y,e.z);
  e.enterStartQ=new THREE.Quaternion().setFromAxisAngle(YAXIS,e.yaw);
  // The crown-facing side of the forehead and the temples stay clear of the eyes.
  const dx=e.x-HEADW.c.x, dz=e.z-HEADW.c.z;
  const side=clamp(dx/HEADW.r.x*0.78+Math.sin(e.seed)*0.16,-0.9,0.9);
  const crown=0.50+0.13*(0.5+0.5*Math.sin(e.seed*1.7));
  const front=Math.min(-0.34-0.10*(0.5+0.5*Math.cos(e.seed*1.3)),dz/HEADW.r.z);
  e.u.set(side,crown,front).normalize();
  headNormalAt(e.u,e.n);
  e.enterPoint=new V3(HEADW.c.x+e.u.x*HEADW.r.x,HEADW.c.y+e.u.y*HEADW.r.y,HEADW.c.z+e.u.z*HEADW.r.z);
  e.enterQ=new THREE.Quaternion().setFromUnitVectors(YAXIS,e.n.clone().negate());
  if(e.bubble){ e.bubble.remove(); e.bubble=null; }
  SFX.enterTouch();
  placeEntering(e);
}
function placeEntering(e){
  const p=clamp(e.t/CFG.ENTER_TIME,0,1), turn=0.28;
  if(p<turn){
    const k=easeOut(p/turn), tip=e.enterPoint.clone().addScaledVector(e.n,EH+0.006);
    tmpV.lerpVectors(e.enterFrom,tip,k); tmpV.y+=Math.sin(k*Math.PI)*0.025;
    e.q.copy(e.enterStartQ).slerp(e.enterQ,k);
  } else {
    const k=ease((p-turn)/(1-turn));
    // Head, shoulders and feet cross the same entry point, in that order.
    tmpV.copy(e.enterPoint).addScaledVector(e.n,lerp(EH+0.006,-0.038,k));
    e.q.copy(e.enterQ);
    e.scale=1-0.28*Math.pow(k,3);
  }
  e.x=tmpV.x; e.y=tmpV.y; e.z=tmpV.z;
}
function finishEnter(e){
  if(!e.alive) return;
  const mass=Math.max(1,Math.round(e.kind==='lump'?(e.faces||e.mass||1):(e.mass||1)));
  G.invaders+=mass;
  const before=G.tear;
  G.tear=Math.min(1,G.tear+CFG.ENTRY_TEAR*mass);
  queueTearGain(G.tear-before);
  G.gnawPulse=1;
  // The ultimate is fed only by a self actually getting inside, not by time or routine kills.
  chargeUltimate(20*mass);
  removeEnemy(e);
}

function updateEnterWetSound(hard=false){
  const turn=0.28;
  let count=0;
  let pressure=0;
  let depth=0;
  let pan=0;
  let weight=0;

  for(const e of EN.list){
    if(!e.alive||e.state!=='enter') continue;

    const p=clamp(e.t/CFG.ENTER_TIME,0,1);

    // 앞 28%는 머리 쪽으로 방향만 트는 구간이라 무음
    if(p<turn) continue;

    const k=ease((p-turn)/(1-turn));
    const w=Math.pow(
      Math.max(0,Math.sin(Math.PI*k)),
      0.7
    );

    if(w<=0.0001) continue;

    count++;
    pressure+=w;
    depth+=k*w;

    const x=e.enterPoint
      ? (e.enterPoint.x-HEADW.c.x)/HEADW.r.x
      : 0;

    pan+=clamp(x,-1,1)*w;
    weight+=w;
  }

  SFX.enterWet(
    count,
    count?pressure/count:0,
    weight?depth/weight:0,
    weight?pan/weight:0,
    hard
  );
}

function kimbapMesh(s){
  s=s||1;
  const g=new THREE.Group();

  const tri=new THREE.Shape();
  tri.moveTo(-0.045*s,-0.038*s);
  tri.lineTo(0.045*s,-0.038*s);
  tri.lineTo(0,0.045*s);
  tri.closePath();

  const shellGeo=new THREE.ExtrudeGeometry(tri,{
    depth:0.028*s,
    bevelEnabled:true,
    bevelThickness:0.004*s,
    bevelSize:0.004*s,
    bevelSegments:2
  });
  shellGeo.translate(0,0,-0.014*s);
  g.add(mesh(shellGeo,M.gim,0,0,0));

  const riceTri=new THREE.Shape();
  riceTri.moveTo(-0.024*s,-0.002*s);
  riceTri.lineTo(0.024*s,-0.002*s);
  riceTri.lineTo(0,0.034*s);
  riceTri.closePath();

  const riceGeo=new THREE.ShapeGeometry(riceTri);
  const riceFront=mesh(riceGeo,M.rice,0,0,0.0185*s);
  const riceBack=mesh(riceGeo.clone(),M.rice,0,0,-0.0185*s);
  riceBack.rotation.y=Math.PI;
  g.add(riceFront,riceBack);

  g.add(mesh(
    new THREE.BoxGeometry(0.026*s,0.015*s,0.039*s),
    M.red,0,-0.019*s,0
  ));

  return g;
}

const towerG=new THREE.Group(); scene.add(towerG);
function towerPos(t){ return new V3(t.x, groundY(t.x,t.z), t.z); }
function makeTower(foodId,x,z,ammo){
  if(ammo!==undefined&&ammo<=0) return null;

  const food=FOOD_BY[foodId];
  const t={
    id:towerSeq++,
    food,
    x,z,
    ammo:ammo===undefined?food.ammo:ammo,
    cdT:0,
    full:null,
    blocks:true,
    manualGrace:0,
    pulse:0,
    spoilK:0,
    exhausted:false,
    yaw:rand(-0.4,0.4),
    badge:null,
    badgeY:food.h+0.03
  };

  t.full=buildFood(foodId,true);
  t.full.rotation.y=t.yaw;

  const p=towerPos(t);
  t.full.position.copy(p);
  towerG.add(t.full);

  const bb=new THREE.Box3().setFromObject(t.full);
  t.badgeY=Math.max(t.badgeY,bb.max.y-p.y+0.025);

  t.full.userData.tower=t;
  setTowerState(t);
  towers.push(t);
  return t;
}

function setTowerState(t){
  const e=t.ammo<=0;
  const ratio=clamp(t.ammo/t.food.ammo,0,1);
  const units=[];

  t.full.visible=!e;
  t.blocks=!e;

  t.full.traverse(o=>{
    if(o.userData&&o.userData.ammoUnit) units.push(o);
  });

  const shown=Math.ceil(units.length*ratio);
  units.forEach((o,i)=>{
    o.visible=i<shown;
  });

  const soup=t.full.getObjectByName('ramenFill');
  if(soup){
    soup.visible=!e;
    soup.position.y=lerp(0.055,0.092,ratio);
  }

  const cola=t.full.getObjectByName('colaFill');
  if(cola){
    cola.visible=!e;
    cola.scale.y=Math.max(0.001,ratio);
    cola.position.y=0.216*ratio*0.5;
  }
}

function removeTower(t){
  if(typeof AIM!=='undefined'&&AIM.tower===t) cancelAim();
  towerG.remove(t.full);
  disposeRetryVisual(t.full,false);
  towers=towers.filter(x=>x!==t);

  if(t.badge){
    t.badge.remove();
    t.badge=null;
  }
}

function exhaustTower(t){
  if(t.exhausted) return;
  t.exhausted=true;

  const empty=buildFood(t.food.id,false);
  const p=towerPos(t);

  empty.position.copy(p);
  empty.rotation.y=t.yaw+rand(-0.18,0.18);
  scene.add(empty);
  addTrash(empty,'pack');

  removeTower(t);
  FF.rebuild(towers);
}

      if(FF.reachAt(e.x,e.z)||!t||!t.blocks||towers.indexOf(t)<0){ e.state='walk'; e.t=0; e.stuck=0; continue; }
      e.x+=e.sx*dt*0.5; e.z+=e.sz*dt*0.5; pushOutOfTowers(e); e.y=groundY(e.x,e.z);
      let nb=0; shQuery(e.x,e.z,0.13,(o)=>{ if(o!==e&&(o.state==='squat'||o.state==='climb')) nb++; });
      e.climbT+=dt*(1+0.45*Math.min(8,nb)); e.anim+=dt*2;
      if(e.climbT>=CLIMB_T) startClimb(e);
    }
    else if(e.state==='climb'){ updClimb(e,dt); }
    else if(e.state==='slip'){ e.anim+=dt; if(e.t>0.9){ e.state='walk'; e.t=0; } }
    else if(e.state==='intro'){ updIntro(e,dt); }
    else if(e.state==='evolve'){ updateEvolvingEnemy(e,dt,doneGroups); }
    else if(e.state==='enter'){ e.anim+=dt*14; placeEntering(e); if(e.t>=CFG.ENTER_TIME) finishEnter(e); }
    else if(e.state==='fly'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.z+=e.vz*dt; e.vy-=7.5*dt; e.rx+=e.vrx*dt; e.ry+=e.vry*dt; e.rz+=e.vrz*dt; e.x=clamp(e.x,ROOM.x0+0.03,ROOM.x1-0.03); e.z=clamp(e.z,ROOM.z0+0.02,ROOM.z1-0.03);
      const gy=groundY(e.x,e.z), hy=headSurfaceY(e.x,e.z); if(e.y<=Math.max(gy,hy)){ if(hy>gy){ e.y=hy; startEnter(e); } else { e.y=gy; e.state='walk'; e.vx*=0.2; e.vz*=0.2; e.yaw=e.ry; e.t=0; } } }
    else if(e.state==='leave'){ e.scale=Math.max(0,e.scale-dt*1.6); e.y=groundY(e.x,e.z)+(1-e.scale)*0.02; if(e.scale<=0.02) removeEnemy(e); }
    else if(e.state==='wander'){ if(!e.tgt||e.t>rand(6,9)){ const tz=rand(-3.2,-0.9); e.tgt=[rand(-1,1)*walkW(tz)*0.8,tz]; e.t=0; } let dx=e.tgt[0]-e.x, dz=e.tgt[1]-e.z; const d=Math.hypot(dx,dz); if(d<0.05){ e.tgt=null; continue; } dx/=d; dz/=d; const moveSpeed=e.speed*(e.hasteT>0?1.22:1), nx=e.x+(dx*moveSpeed+e.sx)*dt, nz=e.z+(dz*moveSpeed+e.sz)*dt; if(FF.isBase(nx,nz)){ e.tgt=null; continue; } e.vx=dx*moveSpeed; e.vz=dz*moveSpeed; e.x=nx; e.z=nz; pushOutOfTowers(e); e.y=groundY(e.x,e.z); e.anim+=dt*(moveSpeed*40+1.5); const ty=Math.atan2(e.vx,e.vz); let dd=ty-e.yaw; dd=Math.atan2(Math.sin(dd),Math.cos(dd)); e.yaw+=dd*Math.min(1,dt*6); }
  }
  for(const g of doneGroups) finishEvolution(g);
  updateEnemyEvolution(dt);
  updateEnterWetSound();
}
function updTowers(dt){
  for(const t of towers.slice()){
    t.pulse=Math.max(0,t.pulse-dt*4);
    if(t.ammo<=0){ exhaustTower(t); continue; }
    t.cdT-=dt;
    if(typeof AIM!=='undefined'&&AIM.active&&AIM.tower===t) continue;
    if(t.manualGrace>0){ t.manualGrace-=dt; continue; }
    if(t.cdT<=0&&!fireTower(t)) t.cdT=0.25;
  }
}

/* ---------- play update ---------- */
function updPlay(dt){
  if(SELF_HIT.active){ updSelfHit(dt); updParts(dt); return; }
  const firstPlacementHold=!seenHints.place&&towers.length===0;
  if(!firstPlacementHold) G.t+=dt;
  while(G.cueIdx<G.cues.length&&G.cues[G.cueIdx].t<=G.t){ const c=G.cues[G.cueIdx]; doCue(c); if(c.ent==='door') G.kickAt=c.flood; G.cueIdx++; }
  if(G.kickAt&&G.t>=G.kickAt){ G.kickAt=0; ENTR.doorKick=0.75; SFX.doorBurst(); if(G.party){ SFX.horn(); setTimeout(()=>SFX.horn(1.2),260); } }
  while(G.spawnIdx<G.spawns.length&&G.spawns[G.spawnIdx].t<=G.t){ const s=G.spawns[G.spawnIdx]; spawnFrom(s.ent,{speed:G.plan.speed,src:s.src}); G.spawnIdx++; }
  for(let i=G.extra.length-1;i>=0;i--){ if(G.extra[i].t<=G.t){ spawnFrom(G.extra[i].ent,{speed:G.plan.speed}); G.extra.splice(i,1); } }
  updTowers(dt); updEnemies(dt); updProjs(dt); updZones(dt); updParts(dt);
  G.gnawPulse=Math.max(0,G.gnawPulse-dt*3);
  if(G.invaders){
    // Each one remains inside for this stage; there is no cleansing action.
    G.tear+=Math.min(CFG.MAX_EROSION,G.invaders*CFG.INNER_EROSION)*dt;
    if(Math.random()<dt*Math.min(4,G.invaders*0.14)) G.gnawPulse=Math.max(G.gnawPulse,0.28);
  }
  updateDanger(dt);
  if(G.tear>=1){ G.tear=1; startCry(); return; }
  let walkers=0; for(const e of EN.list) if(e.state==='walk') walkers++;
  // Only the crowd already in the room can make a sound. No arrival cue.
  if(walkers>0&&Math.random()<Math.min(0.55,walkers*0.012)*dt*10){ Math.random()<0.55?SFX.sniff(0.03+Math.min(0.03,walkers*0.0004)):SFX.heuk(0.024); }
  if(walkers>6&&Math.random()<dt*Math.min(30,walkers*0.8)) SFX.patter(Math.min(0.05,0.008+walkers*0.0008));
  if(allSpawned()){
    const alive=EN.list.filter(e=>e.alive&&e.state!=='leave').length;
    if(alive===0&&projs.length===0){ startHush(); }
    else G.stallT=0;
  }
}

/* ---------- the quiet after a day is won ----------

   for a moment before he gets up for work. */
let HUSH=null;

/* ---------- phone loan ---------- */
function phoneLit(){ return G.scene==='play'&&G.money<CFG.BROKE; }
function loanAvailable(){ return Math.max(0,CFG.LOAN_LIMIT-G.loanBalance); }
function loanEnemyCount(amount){ return Math.min(24,(CFG.LOAN_SWARM[amount]||3)+Math.floor(G.loanBalance/500000)); }
function takeLoan(amount){
  if(!phoneLit()||!CFG.LOAN_OPTIONS.includes(amount)) return false;
  if(amount>loanAvailable()){ SFX.denied(); toast('대출 한도가 부족합니다.',2); return false; }
  const n=loanEnemyCount(amount);
  G.money+=amount; G.loanBalance+=amount; G.debt+=amount;
  markHint('loan'); setLoanOpen(false);
  sms('은행',WEB+'입금 '+won(amount)+' 비상금대출\n다음 날부터 통장 잔액으로 자동 상환 · 잔액 '+won(G.loanBalance));
  for(let i=0;i<n;i++) G.extra.push({t:G.t+1.2+i*0.85,ent:'phone'});
  SFX.cash(); floatMoney('+'+won(amount),'plus'); PHONEG.flash=1; hudDirty=true;
  return true;
}
let phoneBuzzT=0;
function updPhone(dt){

  if(lit&&canBorrow){ const p=(Math.sin(G.time*6)+1)/2; col=p>0.5?0xFFFFFF:0xCFE6FF; li=0.55+p*0.35; phoneBuzzT-=dt; if(phoneBuzzT<=0){ phoneBuzzT=1.7; SFX.phoneBuzz(); } }
  else phoneBuzzT=0.3;
  if(lit&&!canBorrow){ col=0x6B3038; li=0.25; }
  if(pending){ const p=(Math.sin(G.time*9)+1)/2; col=p>0.5?0xB388FF:0x7C4DFF; li=0.7; }
  // the alarm he sleeps through: the phone lights and rattles by the bed
  const alarm=G.scene==='cut'&&CUT&&CUT.alarm, ring=alarm&&(G.time%0.62)<0.4;
  if(alarm){ col=ring?0xFFFFFF:0xCFE6FF; li=ring?1.0:0.5; }

}
/* ---------- cutscene (출근) ---------- */
// What the night will be on a completed day: out to work, or overslept and into a taxi. Missing a shift is not random;
// it happens only after the tears overflow and the player abandons that night's work.
function messLevel(){ let rot=0; for(const m of trash) if(m.userData.kind==='food') rot++; return clamp(lumpArea()/LUMP_CAP,0,1)*0.4+clamp(rot/10,0,1)*0.25+trashFill()*0.35; }
function nightOutcome(){ const day=G.shift+1; if(day<=1) return 'work';
  const mess=messLevel(), f=clamp(G.fat/1.4,0,1), s=clamp(G.stain/2.2,0,1);
  const pLate=clamp(0.09+0.06*f+0.05*s+0.04*mess,0,0.28);
  return Math.random()<pLate?'late':'work'; }
// the night itself, whether he is at work or still in bed: the day ticks over, the room dims, food goes off, the clock
// and the window run on to morning
function nightStart(c){ if(c.nightOn) return; c.nightOn=true; G.round++; if(c.mode!=='stay'){ G.shift++; recordBestShift(G.shift); } hudDirty=true; G.fat=c.fat1; GI.setFat(G.fat); updHeadW(); }
function nightTick(c,k,dt){
  nightStart(c);
  const kw=clamp((k-0.1)/0.8,0,1), hours=c.h0+(9-c.h0)*ease(kw), spoilK=ease(clamp((k-0.12)/0.68,0,1));
  if(!c.spoilGo&&spoilK>0){ c.spoilGo=true; const rotting=trash.some(m=>m.userData.kind==='food'&&!m.userData.age); spoilStart(); if(towers.length||rotting) SFX.flies(); }
  if(c.spoilGo&&!c.spoilDone){ spoilStep(spoilK,dt); if(!c.squished&&spoilK>0.6&&towers.length){ c.squished=true; SFX.squish(); } if(spoilK>=1){ c.spoilDone=true; spoilEnd(); } }
  clockHour.rotation.z=-(23+hours)*Math.PI/6; clockMinute.rotation.z=-hours*Math.PI*2;
  windowPane.material.color.setHex(0x22346A).lerp(new THREE.Color(0xE5BD91),ease(kw)); windowMoon.visible=kw<0.6;
  const cover=clamp(Math.min(k/0.15,(1-k)/0.15),0,1); const fade=$('dayFade'); if(fade) fade.style.opacity=0.6*cover;
  updCameo(c,k,dt);
}
function payTaxi(c){ if(!c.taxi||c.taxiPaid) return; c.taxiPaid=true; const f=Math.min(G.money,c.fare); G.money-=f; G.monthTaxi+=f; G.monthTaxiN++; hudDirty=true; floatMoney('-'+won(f),'minus'); SFX.broke(); sms('카드',WEB+'승인 '+won(f)+' 택시\n잔액 '+won(G.money)); }
// Morning: what the night paid, then what the month takes. What's owed comes out of the account first, all of it
// that's there: rent arrears, then unpaid bills, then the phone loan. A short rent becomes arrears immediately;
// three mornings remain to clear it before the lease ends.
function payBill(amt,label,kind){ const paid=Math.min(G.money,amt), owed=amt-paid; G.money-=paid;
  if(paid>0) sms('은행',WEB+'출금 '+won(paid)+' '+label+(owed?' (일부)':'')+'\n잔액 '+won(G.money));
  else sms('은행',WEB+label+' '+won(amt)+'\n잔액 부족으로 출금되지 않았습니다.');
  if(owed){ G.debt+=owed; if(kind==='rent') G.rentOwed+=owed; else G.billOwed+=owed; }
  return {paid,owed}; }
function accrueLoanInterest(){
  if(G.loanBalance<=0) return 0;
  const interest=Math.max(1,Math.round(G.loanBalance*(CFG.LOAN_APR/12)));
  G.loanBalance+=interest; G.debt+=interest;
  sms('은행',WEB+'비상금대출 이자 '+won(interest)+'\n대출 잔액 '+won(G.loanBalance)+' · 연 '+Math.round(CFG.LOAN_APR*100)+'%');
  return interest;
}
function collectOwed(){ let back=Math.min(G.debt,G.money); if(back<=0) return 0; const total=back;
  const take=(amt,label)=>{ if(amt<=0) return; G.debt-=amt; G.money-=amt; back-=amt; sms('은행',WEB+'출금 '+won(amt)+' '+label+'\n잔액 '+won(G.money)); };
  const r=Math.min(G.rentOwed,back); G.rentOwed-=r; take(r,'월세 미납분');
  const b=Math.min(G.billOwed,back); G.billOwed-=b; take(b,'미납 요금');
  const l=Math.min(G.loanBalance,back); G.loanBalance-=l; take(l,'대출 상환');
  return total-back; }
function settleMorning(showFx=true){
  const c=CUT; if(!c||c.paid) return; c.paid=true;
  const n=G.round, md=n%CFG.MONTH, worked=c.mode!=='stay', docked=c.mode==='late'&&!c.taxi;
  let pay=worked?CFG.WAGE-(docked?CFG.HOUR_NIGHT:0):0, weekly=0;
  if(!worked){ G.weekMiss++; G.monthMiss++; }
  if(n%CFG.WEEK===0){ if(!G.weekMiss) weekly=CFG.WEEKLY_PAY; G.weekMiss=0; }
  if(!worked) sms('근무 알림',WEB+(G.monthMiss>1?'이번 달 미출근 '+G.monthMiss+'회째입니다.':'출근 확정 후 미출근 처리되었습니다.')+'\n미출근이 반복되면 이후 근무 배정 우선순위가 낮아질 수 있습니다.');
  if(docked) sms('근무 알림',WEB+'출근 '+c.clockIn+' 지각 처리되었습니다.');
  const income=pay+weekly;
  if(income){ G.money+=income; sms('은행',WEB+'입금 '+won(income)+(weekly?(pay?' 급여·주휴수당':' 주휴수당'):'')+'\n잔액 '+won(G.money)); }
  if(md===CFG.RENT_DAY&&n>0) accrueLoanInterest();
  let out=collectOwed();
  if(G.rentOwed<=0) G.evictDue=-1;
  else if(G.evictDue>=0&&n>=G.evictDue){
    G.evicted=true;
    sms('집주인','월세 미납 기한이 지났습니다.\n계약 해지하겠습니다. 방 정리해 주세요.');
    c.debtFloat=out; c.debtFloatAt=c.t+0.65; if(!showFx) c.debtShown=true; hudDirty=true; return;
  }
  if(showFx&&income>0){ SFX.coin(); if(weekly) SFX.bonus(); floatMoney('+'+won(income),'plus'); }
  // the month's bills, each on its own morning
  if(md===CFG.RENT_DAY&&n>0){
    const {paid,owed}=payBill(CFG.RENT,'월세','rent'); out+=paid;
    if(G.rentOwed>0){
      if(G.evictDue<0) G.evictDue=n+3;
      sms('집주인','월세 미납액 '+won(G.rentOwed)+' 확인 부탁드립니다.\n3일 안에 정리해 주세요.');
    } else G.evictDue=-1;
    // the one saving there is: a few won a month toward a flat of his own, if anything is left once the rent is out
    if(G.money>=CFG.SAVE){ G.money-=CFG.SAVE; out+=CFG.SAVE; G.saveN++; sms('은행',WEB+'출금 '+won(CFG.SAVE)+' 주택청약\n잔액 '+won(G.money)); }
    else { G.saveMiss++; sms('은행',WEB+'주택청약 '+won(CFG.SAVE)+'\n잔액 부족으로 출금되지 않았습니다.'); }
    G.monthMiss=0;
  }
  if(md===(CFG.RENT_DAY+1)%CFG.MONTH&&n>(CFG.RENT_DAY||CFG.MONTH)&&(G.monthBuys||G.monthTaxiN||G.monthClean)){
    sms('카드',WEB+'지난달 이용 내역'+(G.monthBuys?'\n배달·편의점 '+G.monthBuys+'건 '+won(G.monthFood):'')+(G.monthTaxiN?'\n택시 '+G.monthTaxiN+'건 '+won(G.monthTaxi):'')+(G.monthClean?'\n청소 대행 '+won(G.monthClean):''));
    G.monthFood=0; G.monthBuys=0; G.monthTaxi=0; G.monthTaxiN=0; G.monthClean=0; }
  if(md===CFG.PHONE_DAY&&n>0) out+=payBill(CFG.PHONE_BILL,'휴대폰 요금','bill').paid;
  if(md===CFG.UTIL_DAY&&n>0) out+=payBill(Math.round(rand(CFG.UTIL[0],CFG.UTIL[1])/10)*10,'도시가스·전기','bill').paid;
  // everything that went straight back out shows as one minus under the pay
  c.debtFloat=out; c.debtFloatAt=c.t+0.65; if(!showFx) c.debtShown=true;

// Once a missed shift leaves no food money and no usable loan draw, there is no meaningful next decision.
// Keep the room exactly as the failed night left it and let the calendar, rent notices and eviction play out.
function collectOwedSilent(){
  let back=Math.min(G.debt,G.money);
  const take=amt=>{ if(amt<=0) return; G.debt-=amt; G.money-=amt; back-=amt; };
  const r=Math.min(G.rentOwed,back); G.rentOwed-=r; take(r);
  const b=Math.min(G.billOwed,back); G.billOwed-=b; take(b);
  const l=Math.min(G.loanBalance,back); G.loanBalance-=l; take(l);
}
function chargeSilent(amt,kind){
  const paid=Math.min(G.money,amt), owed=amt-paid;
  G.money-=paid;
  if(owed){ G.debt+=owed; if(kind==='rent') G.rentOwed+=owed; else G.billOwed+=owed; }
  return {paid,owed};
}
function advanceAbandonedDay(){
  G.round++;
  G.weekMiss++;
  G.monthMiss++;
  if(G.round%CFG.WEEK===0) G.weekMiss=0;
  const n=G.round, md=n%CFG.MONTH;

  if(md===CFG.RENT_DAY&&n>0&&G.loanBalance>0){
    const interest=Math.max(1,Math.round(G.loanBalance*(CFG.LOAN_APR/12)));
    G.loanBalance+=interest;
    G.debt+=interest;
  }
  collectOwedSilent();

  if(G.rentOwed<=0) G.evictDue=-1;
  else if(G.evictDue>=0&&n>=G.evictDue){
    G.evicted=true;
    sms('집주인','월세 미납 기한이 지났습니다.\n계약 해지하겠습니다. 방 정리해 주세요.',{hold:2.4});
    hudDirty=true;
    return true;
  }

  if(md===CFG.RENT_DAY&&n>0){
    const {paid,owed}=chargeSilent(CFG.RENT,'rent');
    if(paid>0) sms('은행',WEB+'출금 '+won(paid)+' 월세'+(owed?' (일부)':'')+'\n잔액 '+won(G.money),{hold:1.8});
    else sms('은행',WEB+'월세 '+won(CFG.RENT)+'\n잔액 부족으로 출금되지 않았습니다.',{hold:1.8});
    if(G.rentOwed>0){
      if(G.evictDue<0) G.evictDue=n+3;
      sms('집주인','월세 미납액 '+won(G.rentOwed)+' 확인 부탁드립니다.\n3일 안에 정리해 주세요.',{hold:2.1});
    } else G.evictDue=-1;
    G.saveMiss++;
    G.monthMiss=0;
  }
  if(md===CFG.PHONE_DAY&&n>0) chargeSilent(CFG.PHONE_BILL,'bill');
  if(md===CFG.UTIL_DAY&&n>0) chargeSilent(Math.round(rand(CFG.UTIL[0],CFG.UTIL[1])/10)*10,'bill');
  hudDirty=true;
  return false;
}

function finishCut(skipped=false){
  const c=CUT;
  if(!c) return;
  if(skipped&&c.mode!=='stay') stampCommuteTrail(c);

  if(!c.spoilDone){
    if(!c.spoilGo){
      c.spoilGo=true;
      spoilStart();
    }
    spoilStep(1,0);
    c.spoilDone=true;
    spoilEnd();
  }

  if(c.cameo){
    removeEnemy(c.cameo);
    c.cameo=null;
  }

  nightStart(c);
  if(c.mode==='late') payTaxi(c);
  settleMorning(!skipped);

  if(skipped) c.debtShown=true;
  else showCutDebt(c);

  resetCommuteVisual();
  GI.lie();
  camMix=0;
  doorTarget=DOOR_GAP;

  hudDirty=true;
  const bankrupt=c.mode==='stay'&&G.money<CHEAPEST_FOOD&&loanAvailable()<MIN_LOAN_DRAW;
  CUT=null;
  if(G.evicted) startEviction();
  else if(bankrupt) startBankruptcyMontage();
  else if(G.round===10&&!G.firstRentShown) showFirstRentMilestone();
  else startRound(G.round);
}

let bubbles=[];

// 기본 독백은 계속 남고, 본체와 함께 살이 찔수록 체중 독백이 섞입니다.
let lineBag=[], fatLineBag=[], lastLine='';

function shuffled(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];
    a[i]=a[j];
    a[j]=t;
  }
  return a;
}

function resetLineBags(){ lineBag=[]; fatLineBag=[]; lastLine=''; }
function currentFatLines(){ const out=[]; for(const tier of FAT_LINES) if(G.fat>=tier.min) out.push(...tier.lines); return out; }
function pullLine(pool,kind,busy){
  if(!pool.length) return '';
  let bag=kind==='fat'?fatLineBag:lineBag, i=bag.findIndex(l=>pool.includes(l)&&!busy.has(l));
  if(i<0){ bag=bag.concat(shuffled(pool)); i=bag.findIndex(l=>!busy.has(l)); }
  const out=i<0?'':bag.splice(i,1)[0];
  if(kind==='fat') fatLineBag=bag; else lineBag=bag;
  return out;
}
function nextLine(){
  const busy=new Set(bubbles.map(b=>b.text)), fatPool=currentFatLines();
  if(LINES.length+fatPool.length>busy.size+1&&lastLine) busy.add(lastLine);
  const fatChance=clamp(3*fatPool.length/(fatPool.length+LINES.length),0,0.55), fatFirst=fatPool.length&&Math.random()<fatChance;
  let text=pullLine(fatFirst?fatPool:LINES,fatFirst?'fat':'base',busy);
  if(!text) text=pullLine(fatFirst?LINES:fatPool,fatFirst?'base':'fat',busy);
  if(!text) text=pick(LINES);
  return lastLine=text;
}

function dropBubble(i,hard=false){
  const b=bubbles[i];
  if(!b) return;

  if(b.voice) b.voice.stop(hard);
  b.el.remove();

  if(b.e.bubble===b.el) b.e.bubble=null;
  bubbles.splice(i,1);
}

function clearBubbles(hard=false){
  for(let i=bubbles.length-1;i>=0;i--) dropBubble(i,hard);
}

function showEnemyLine(e,text,o={}){
  if(!e||!e.alive||G.scene!=='play') return;
  const old=bubbles.findIndex(b=>b.e===e); if(old>=0) dropBubble(old,true);
  else if(e.bubble){ e.bubble.remove(); e.bubble=null; }

function updateBubbles(dt){
  const placed=[];
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];

    if(b.voice.t0!=null&&AC) b.age=AC.currentTime-b.voice.t0;
    else b.age+=dt;

    const elapsed=Math.max(0,b.age);
    b.t=b.life-elapsed;

    if(
      G.scene!=='play'||
      b.t<=0||
      !b.e.alive||
      (b.forced?(b.e.state==='dead'||b.e.state==='leave'||b.e.state==='enter'):b.e.state!=='walk')
    ){
      dropBubble(i);
      continue;
    }

    while(
      b.next<b.steps.length&&
      b.steps[b.next].t<=b.age
    ){
      b.typed.textContent+=b.steps[b.next++].ch;
    }

    projectTo(b.e.x,b.e.y+.2,b.e.z,scr);

    const bw=b.el.offsetWidth, bh=b.el.offsetHeight;
    const wantedX=scr.x, wantedBottom=scr.y-8;
    const choices=[wantedX,wantedX-bw*0.75,wantedX+bw*0.75].map(x=>clamp(x,12+bw/2,window.innerWidth-12-bw/2));
    let bx=choices[0], bottom=wantedBottom, best=Infinity;
    const overlap=(x,y,r)=>x-bw/2<r.right&&x+bw/2>r.left&&y-bh<r.bottom&&y>r.top;
    for(const x of choices){ const n=placed.reduce((sum,r)=>sum+(overlap(x,bottom,r)?1:0),0); if(n<best){ best=n; bx=x; } }
    let guard=0; while(placed.some(r=>overlap(bx,bottom,r))&&guard++<3) bottom-=bh+6;

    b.el.style.left=bx+'px';
    b.el.style.top=bottom+'px';
    b.el.style.setProperty(
      '--tail',
      clamp(scr.x-bx+bw/2,8,bw-8)+'px'
    );
    b.el.style.opacity=Math.min(1,b.t*3,elapsed*4);
    placed.push({left:bx-bw/2,right:bx+bw/2,top:bottom-bh,bottom});
  }

  if(G.scene!=='play'||SELF_HIT.active) return;

  if(bubbles.length<3&&Math.random()<dt*.9){
    const cands=EN.list.filter(
      e=>
        e.state==='walk'&&

function billRound(v){ return Math.round(v/10000)*10000; }
function makeEvictionBill(){
  // The room begins with one old pizza lump as scenery. It soon rots away, so exclude the marked seed only while
  // it actually remains; every later lump and fly came from the player's food.
  const heap=trashFill(), loose=clamp(trash.length/24,0,1);
  const dirty=Math.max(heap,loose);
  let seedFlies=0, playerLumps=0;
  for(const L of lumps){ if(L.seed) seedFlies+=L.flies.length; else playerLumps++; }
  const rot=clamp((playerLumps+rotHosts.length)/8,0,1);
  const flies=clamp(Math.max(0,flyCount()-seedFlies)/14,0,1);
  const removal=dirty>.035?billRound(40000+180000*dirty):0;
  const cleanK=Math.max(dirty,rot);
  const cleaning=cleanK>.08?billRound(60000+320000*cleanK):0;
  const pestK=Math.max(flies,rot*.85,clamp((dirty-.65)/.35,0,1));
  const pest=pestK>.05?billRound(50000+60000*pestK):0;
  const wallK=Math.max(clamp((dirty-.55)/.45,0,1),clamp((rot-.45)/.55,0,1));
  const wallpaper=wallK>.15?billRound(120000+180000*wallK):0;
  const rent=Math.max(0,Math.round(G.rentOwed)), damage=removal+cleaning+pest+wallpaper;
  const total=rent+damage, refund=Math.max(0,CFG.DEPOSIT-total), extra=Math.max(0,total-CFG.DEPOSIT);
  return {deposit:CFG.DEPOSIT,rent,removal,cleaning,pest,wallpaper,damage,total,refund,extra,dirty,rot,flies,settled:false};
}
function evictionSettlementText(b){
  const lines=['방 정리 후 정산합니다.','','보증금 '+won(b.deposit)];
  if(b.rent) lines.push('미납 월세 -'+won(b.rent));
  if(b.removal) lines.push('폐기물 반출 -'+won(b.removal));
  if(b.cleaning) lines.push('특수 청소·탈취 -'+won(b.cleaning));
  if(b.pest) lines.push('해충 방역 -'+won(b.pest));
  if(b.wallpaper) lines.push('오염 복구·부분 도배 -'+won(b.wallpaper));

  if(b.refund>0) lines.push('공제 후 '+won(b.refund)+' 입금했습니다.');

function settleEvictionBill(b){
  if(!b||b.settled) return b;
  b.settled=true;
  const rentCovered=Math.min(b.rent,b.deposit);
  G.rentOwed=Math.max(0,G.rentOwed-rentCovered);
  G.debt=Math.max(0,G.debt-rentCovered);
  const damageCovered=Math.max(0,b.deposit-b.rent);
  const damageUncovered=Math.max(0,b.damage-damageCovered);
  if(damageUncovered){ G.billOwed+=damageUncovered; G.debt+=damageUncovered; }
  if(b.refund){ G.money+=b.refund; floatMoney('+'+won(b.refund),'plus'); SFX.coin(); }
  hudDirty=true;

}

const DOOR_KEEPOUT=1.0;


const PLACE_DOOR_GAP=0.34, PLACE_OVERLAP=0.55;
function circleRectHit(x,z,r,x0,z0,x1,z1){ const qx=clamp(x,x0,x1), qz=clamp(z,z0,z1); return Math.hypot(x-qx,z-qz)<r; }

    if(s.k==='rect'){ if(circleRectHit(x,z,r,s.x0,s.z0,s.x1,s.z1)) return s; }
    else if(Math.hypot(x-s.x,z-s.z)<s.r+r) return s;

// Placement follows visible geometry, not the invisible pathfinding corridor used by the enemies.
function placeReason(id,x,z,ignore=null){ const f=FOOD_BY[id], r=placementRadius(f);
  if(z<ROOM.z0+PLACE_DOOR_GAP+r) return '문 앞엔 못 놔요';
  if(x<ROOM.x0+r+0.025||x>ROOM.x1-r-0.025||z>ROOM.z1-r-0.025) return '벽에 너무 붙었어요';
  if(Math.hypot(x,z)<CFG.HEAD_KEEPOUT+r) return '머리에 너무 가까워요';
  const s=placementStaticAt(x,z,r); if(s) return s.why;
  if(segDist(x,z,LEAF.x0,LEAF.z0,LEAF.x1,LEAF.z1)<LEAF.r+r*0.7) return '문 앞엔 못 놔요';
  if(circleRectHit(x,z,r,-0.35,0.12,0.35,ROOM.z1)) return '내 몸 위엔 못 놔요';
  for(const t of towers){ if(t!==ignore&&Math.hypot(t.x-x,t.z-z)<(t.food.foot+f.foot)*PLACE_OVERLAP) return '다른 음식이랑 겹쳐요'; }

  return ''; }

// A near miss snaps to the closest usable patch of floor instead of rejecting an empty-looking spot.
function resolvePlacement(id,x,z){
  const why=placeReason(id,x,z); if(!why) return {x,z,why:''};
  const step=0.035, rings=4, n=16;

  }
  return {x,z,why};
}

function endDrag(ev){ if(!drag||ev.pointerId!==drag.pointerId) return; if(drag.moved&&phonePressed(ev)){ hideGhost(); try{ app.releasePointerCapture(ev.pointerId); }catch(e){} drag=null; setSelected(null); setLoanOpen(true); return; } if(drag.moved){ const pt=floorPoint(ev); if(pt){ const shown=ghost&&ghostId===drag.id&&ghost.visible?{x:ghostPlaceX,z:ghostPlaceZ}:pt; tryPlace(drag.id,shown); } hideGhost(); setSelected(drag.id,true); } else { setSelected(drag.id); SFX.click(); } try{ app.releasePointerCapture(ev.pointerId); }catch(e){} drag=null; }

let last=performance.now(), eyeTick=0, tSec=0;
function step(dt){
  if(G.scene==='play'&&(loanOpen||AIM.active)) dt*=0.22;
  G.time+=dt;
  if(G.scene==='play') updPlay(dt);
  else if(G.scene==='cut'){
  for(const t of towers) t.pulse=Math.max(0,t.pulse-dt*4);
  updParts(dt);
  updCut(dt);
}
  else if(G.scene==='hush') updHush(dt);
  else if(G.scene==='cry') updCry(dt);
  else if(G.scene==='title'){ updEnemies(dt); updParts(dt); }
  else if(G.scene==='over'){ updParts(dt); }
  else if(G.scene==='bankrupt'){ updParts(dt); updBankruptcyMontage(dt); }
  else if(G.scene==='evict'){ updParts(dt); updEvict(dt); }
  updSelfHitWaves(dt); updUltAfter(dt);
  if(G.scene!=='hush'&&camHush>0) camHush=Math.max(0,camHush-dt/0.6);
  // door
  if(doorRattle>0) doorRattle-=dt;
  updEntrances(dt); updLumps(dt); updPhone(dt); updSms(dt); updCleanBtn(dt);
  const dTarget=(ENTR.doorKick>0&&G.scene==='play'?Math.max(doorTarget,1.62):doorTarget)+(doorRattle>0?Math.sin(G.time*38)*0.045:0); doorAng+=(dTarget-doorAng)*Math.min(1,dt*(ENTR.doorKick>0.5?20:6)); doorHinge.rotation.y=-doorAng;
  if(camShakeT>0){ camShakeT-=dt; if(camShakeT<=0) camShake=0; }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity=0; }
  if(cutCaptionT>0){ cutCaptionT-=dt; if(cutCaptionT<=0) hideCutCaption(); }
  if(tipHoldT>0){ tipHoldT-=dt; if(tipHoldT<=0&&!ghost) ghostTip.style.display='none'; }
  if(G.scene!=='play'&&!ghost) ghostTip.style.display='none';
  updateTearMeter(dt);
}
function render(now,dt=1/60){
  applyCamera(); ULTFX.update(dt);
  if(window.__fanBlades) window.__fanBlades.rotation.z+=dt*10;
  syncEnemies(G.time); syncParts();
  for(const t of towers){
  const pulse=1+t.pulse*0.12;
  const spoil=t.spoilK||0;

  t.full.scale.set(
    (1+0.18*spoil)/pulse,
    (1-0.62*spoil)*pulse,
    (1+0.18*spoil)/pulse
  );
}
  if(GI.jig>0){ GI.jig=Math.max(0,GI.jig-dt*1.6); const j=1+Math.sin(G.time*38)*0.08*GI.jig; GI.belly.scale.y=(0.75+0.5*GI.fat)*j; GI.bellyLow.scale.y=0.1*(0.4+0.9*clamp((GI.fat-0.35)/0.45,0,1))*j; }
  // out of breath after the ultimate: the chest heaves for a few seconds
  if(GI.pant>0){ GI.pant=Math.max(0,GI.pant-dt*0.3); const b=Math.sin(G.time*8.8)*0.045*GI.pant; GI.belly.scale.y=(0.75+0.5*GI.fat)*(1+b); GI.torso.scale.z=(0.78+0.8*GI.fat)*(1+b*0.7); if(GI.pant===0){ GI.belly.scale.y=0.75+0.5*GI.fat; GI.torso.scale.z=0.78+0.8*GI.fat; } }
  eyeTick++; if(eyeTick%2===0||G.scene==='cry'||SELF_HIT.active){ const sf=GI.selfHitFace; const st={tear:G.scene==='cry'||G.scene==='over'?1:Math.max(G.tear,sf.tear||0),blink:0,flinch:sf.flinch||0,squeeze:sf.squeeze||0,red:Math.max(sf.red||0,DANGER.level*.16),flush:sf.flush||0,fat:Math.min(1,G.fat),dark:Math.min(1,G.stain/2.2),t:G.time,wob:Math.max(G.gnawPulse,(G.scene==='cry'||G.tear>0.85)?1:0,SELF_HIT.active?0.45:0),rage:sf.rage||0,impact:sf.impact,hitSide:sf.side,woe:sf.woe||0,wide:sf.wide||0}; for(const E of GI.eyes) drawEye(E,st); }
  if(floorDirty){ floorDirtyT+=dt; if(floorDirtyT>0.2){ floorTex.needsUpdate=true; floorDirty=false; floorDirtyT=0; } }
  if(hudDirty) updateHUD(); updateBadges(); updateLoanUI(); updatePauseButton(); positionTearMeter(); updateBubbles(dt);
  GI.headG.updateWorldMatrix(true,false); FACEMARK.u.uHeadInv.value.copy(GI.headG.matrixWorld).invert(); FACEMARK.u.uFlush.value=GI.selfHitFace.flush||0;
  renderer.render(scene,camera);
}
function frame(now){ if(renderLost) return; const dt=Math.min(0.05,(now-last)/1000); last=now; if(!gamePaused) step(dt); render(now,gamePaused?0:dt); requestAnimationFrame(frame); }
function mergeStatic(roots,into){
  const isDyn=o=>{ for(let a=o;a;a=a.parent) if(a.userData&&a.userData.dyn) return true; return false; };
  const buckets=new Map(), gone=[];
  for(const root of roots){ root.updateMatrixWorld(true); root.traverse(o=>{
    if(!o.isMesh||o.isInstancedMesh||!o.visible||Array.isArray(o.material)||isDyn(o)) return;
    const m=o.material; const key=[m.type,m.color?m.color.getHexString():'',m.roughness,m.metalness,m.map?m.map.uuid:'',m.transparent,m.opacity,m.side,m.depthWrite].join('|');
    let b=buckets.get(key); if(!b){ b={mat:m,geos:[],cast:false,recv:false}; buckets.set(key,b); }
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    if(!g.attributes.normal) g.computeVertexNormals(); if(!g.attributes.uv) g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    b.geos.push(g); b.cast=b.cast||o.castShadow; b.recv=b.recv||o.receiveShadow; gone.push(o); }); }
  for(const o of gone) o.parent.remove(o);
  for(const b of buckets.values()){ let n=0; for(const g of b.geos) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let off=0;
    for(const g of b.geos){ pos.set(g.attributes.position.array,off*3); nor.set(g.attributes.normal.array,off*3); uv.set(g.attributes.uv.array,off*2); off+=g.attributes.position.count; g.dispose(); }
    const mg=new THREE.BufferGeometry(); mg.setAttribute('position',new THREE.BufferAttribute(pos,3)); mg.setAttribute('normal',new THREE.BufferAttribute(nor,3)); mg.setAttribute('uv',new THREE.BufferAttribute(uv,2)); mg.computeBoundingSphere();
    const mm=new THREE.Mesh(mg,b.mat); mm.castShadow=b.cast; mm.receiveShadow=b.recv; mm.matrixAutoUpdate=false; mm.updateMatrix(); (into||scene).add(mm); }
}
async function boot(){
  mergeStatic([roomG],ROOM_M); mergeStatic([furn],FURN_M); mergeStatic([furnTrash],PROPS_M);
  paintFloorBase(); FF.rebuild(towers); buildBar(); updHeadW(); new ResizeObserver(()=>layoutCamera()).observe(barEl); updateHUD(); showBar(false); try{ renderer.compile(scene,camera); }catch(e){}
  buildSquashSprites();
  try{ await Promise.race([Promise.all([document.fonts.load("900 20px 'Noto Sans KR'"),document.fonts.load("20px 'Black Han Sans'","자기연민디펜스")]), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  setThumbs();
  for(let i=0;i<4;i++){ const e=spawnEnemy({x:rand(-0.5,0.5),z:rand(-3.0,-1.2),state:'wander',speed:0.12}); }
  showTitle();
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
}

window.__dbg={ G, EN, get towers(){return towers;}, get projs(){return projs;}, get lumps(){return lumps;}, FF, FS, CFG, FOODS, cam:camBase, camera, applyCamera, GI, scene, THREE, drawEye, step, spawnFrom, BATHG, WING, startRound, buildSpawns, roundPlan, get CUT(){return CUT;}, updCut, placeValid, isStaticBlocked,
  start(r){ overlayEl.innerHTML=''; clearEnemies(); newRun(); G.shift=r||0; startRound(r||0); },

  spawnType(kind,n=1,o={}){ const out=[]; for(let i=0;i<n;i++) out.push(spawnEnemy(Object.assign({kind,speed:0.17},o))); return out.filter(Boolean); },
  manual(t,dx=0,dz=1){ t=typeof t==='number'?towers[t]:t; if(!t) return false; t.cdT=0; const l=Math.hypot(dx,dz)||1; return fireTower(t,{x:t.x+dx/l*t.food.range,z:t.z+dz/l*t.food.range}); },
  selfHit(){ return startSelfHit(); }, setFat(v){ G.fat=clamp(v,0,1.4); GI.setFat(G.fat); for(const e of EN.list) e.fatK=G.fat; resetLineBags(); },
  place(id,x,z){ return placeTower(id,x,z); }, valid:placeValid, spawn(n,o){ for(let i=0;i<n;i++) spawnEnemy(o||{speed:0.17}); }, tick(sec){ const st=1/60; for(let i=0;i<sec*60;i++) step(st); }, enter(e){ startEnter(e||EN.list[0]); }, cry(){ G.tear=1; }, cut(){ endRound(); }, skip:skipCut, render(){ render(performance.now()); },
  bot(maxRounds,skip){ const log=[]; skip=skip||[]; this._bad={}; overlayEl.innerHTML=''; clearEnemies(); newRun(); startRound(0);
    const plan=[['ramen',0.05,-2.4],['kimbap',-0.4,-2.0],['fries',0.45,-1.7],['cola',0.0,-1.2],['ramen',-0.45,-0.95],['kimbap',0.5,-0.85],['pizza',0.8,-1.85],['burger',-0.65,-2.4],['chicken',0.0,-0.7],['fries',-0.3,-1.55],['ramen',0.3,-2.45],['kimbap',-0.9,-1.1],['cola',-0.3,-0.6],['fries',0.35,-0.55],['ramen',-0.75,-2.0],['kimbap',0.9,-1.3],['pizza',-1.1,-2.3],['cola',0.55,-2.3],['burger',1.0,-0.7],['ramen',-0.2,-2.55]]; let guard=0, lastRound=-1, peak=0;
    while(guard++<600000){ const dt=1/30; if(EN.list.length>peak) peak=EN.list.length;
      if(G.scene==='play'){ if(G.round!==lastRound){ lastRound=G.round; log.push({round:G.round,shift:G.shift,money:G.money,kills:G.kills,towers:towers.length,peak}); peak=0; }
        for(const [id,x,z] of plan){ if(skip.includes(id)) continue; if(!towers.some(t=>Math.hypot(t.x-x,t.z-z)<0.05)){ const f=FOOD_BY[id]; const key=id+x+z; if(G.money>=f.price&&!this._bad?.[key]){ if(placeValid(id,x,z)) placeTower(id,x,z); else { this._bad=this._bad||{}; this._bad[key]=1; } } } }
        step(dt); }
      else if(G.scene==='hush'){ step(dt); }
      else if(G.scene==='cut'){ CUT.t=99; updCut(dt); }
      else if(G.scene==='cry'){ step(dt); }
      else if(G.scene==='over'){ log.push({dead:true,round:G.round,kills:G.kills,money:G.money}); return log; }
      if(G.round>=maxRounds){ log.push({survived:true,round:G.round,kills:G.kills,money:G.money}); return log; } }
    return log; }
};
